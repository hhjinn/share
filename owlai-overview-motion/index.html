<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>OwlAI 소개 모션 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#fff}
body{font-family:Pretendard,sans-serif;color:#0f0f1f;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block}
.s{position:relative;overflow:hidden}
.in{position:relative;width:1440px;height:100%;margin:0 auto}
.u{position:absolute}
.u img{width:100%;height:auto}
.abs{position:absolute;pointer-events:none}

/* 등장: 아래에서 흐릿하게 올라오며 선명해짐 (Augen) */
.rv{opacity:0;transform:translateY(36px);filter:blur(14px);
 transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1.2s cubic-bezier(.16,.8,.2,1),filter 1s cubic-bezier(.2,.7,.2,1)}
.rv.vis{opacity:1;transform:none;filter:blur(0)}
.rv.ttl{clip-path:inset(0 0 100% 0);transition-property:opacity,transform,filter,clip-path;transition-duration:1s,1.2s,1s,1.1s}
.rv.ttl.vis{clip-path:inset(0 0 -20% 0)}

/* 상단 띠 배너 */

/* GNB: 스크롤하면 위에 붙고 유리 배경 */
.gnb{position:fixed;left:0;right:0;top:0;height:64px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 40px;transition:background .4s,backdrop-filter .4s,border-color .4s;border-bottom:1px solid transparent}
.glogo{display:flex;cursor:pointer}
.gnav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:36px;font-size:15px;line-height:23px}
.gnav a{color:rgba(255,255,255,.72);display:flex;align-items:center;gap:4px;cursor:pointer;transition:color .2s}
.gnav a:hover{color:#fff}
.gright{display:flex;align-items:center;gap:12px}
.gright .lang{position:static;margin-right:4px}
.gbtn{height:40px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:500;display:flex;align-items:center;cursor:pointer;white-space:nowrap;transition:background .2s}
.gbtn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.9)}
.gbtn.ghost:hover{background:rgba(255,255,255,.12)}
.gbtn.pri{background:#fff;color:#002754;font-weight:600;box-shadow:0 6px 28px rgba(20,122,242,.25)}
/* 한영 전환 (GNB는 어두운 바탕, 푸터는 밝은 바탕) */
.lang{position:absolute;z-index:3;display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04)}
.lang button{all:unset;cursor:pointer;height:22px;padding:0 9px;border-radius:999px;font:600 12px/22px Pretendard,sans-serif;letter-spacing:.02em;color:rgba(255,255,255,.55);transition:background .2s,color .2s}
.lang button.on{background:rgba(255,255,255,.16);color:#fff}
.lang.light{border-color:#e3e3eb;background:#fff}
.lang.light button{color:#9aa0a6}
.lang.light button.on{background:#f4f4f8;color:#0f0f1f}
.gnb.sc{background:rgba(0,15,36,.72);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-color:rgba(255,255,255,.08)}

/* 히어로 */
.hero{height:925px;background:#000f24}
.grid{position:absolute;background-image:linear-gradient(to right,var(--gl) 1px,transparent 1px),linear-gradient(to bottom,var(--gl) 1px,transparent 1px);background-size:var(--gs) var(--gs)}
/* 격자 위를 지나가는 빛 */
.grid.sweep{--gl:rgba(140,191,255,.35);-webkit-mask:linear-gradient(115deg,transparent 40%,#000 50%,transparent 60%) 0 0/300% 100%;mask:linear-gradient(115deg,transparent 40%,#000 50%,transparent 60%) 0 0/300% 100%;animation:sweep 9s linear infinite}
@keyframes sweep{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:-50% 0;mask-position:-50% 0}}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.drift1{animation:drift1 16s ease-in-out infinite alternate}
.drift2{animation:drift2 19s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(90px,40px) scale(1.08)}}
@keyframes drift2{to{transform:translate(-110px,-30px) scale(1.12)}}
.beam{position:absolute;width:220px;height:1000px;top:-120px;transform-origin:0 0;filter:blur(40px);opacity:.55;
 background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0))}
.beam.l{left:300px;transform:rotate(-32deg);animation:swayL 11s ease-in-out infinite alternate}
.beam.r{left:1000px;transform:rotate(32deg);animation:swayR 13s ease-in-out infinite alternate}
@keyframes swayL{from{transform:rotate(-35deg);opacity:.45}to{transform:rotate(-28deg);opacity:.7}}
@keyframes swayR{from{transform:rotate(35deg);opacity:.45}to{transform:rotate(28deg);opacity:.7}}
.dot{position:absolute;width:2px;height:2px;background:#fff;animation:twinkle var(--t) ease-in-out var(--dl) infinite alternate}
@keyframes twinkle{from{opacity:var(--a)}to{opacity:calc(var(--a)*.15)}}
.spot{position:absolute;top:0;bottom:0;left:-1000px;right:-1000px;pointer-events:none;opacity:0;transition:opacity .6s;
 background:radial-gradient(520px circle at var(--mx,50%) var(--my,40%),rgba(122,184,255,.10),transparent 60%)}
.hero:hover .spot{opacity:1}
.hc{position:absolute;inset:0;transform-origin:720px 87px}
.badge{position:absolute;left:608px;top:171px;width:224px;height:37px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
 display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;color:rgba(255,255,255,.85)}
.badge b{color:#8cbfff;font-size:13px}
.h1{position:absolute;left:0;right:0;top:236px;text-align:center;font-size:72px;line-height:87.84px;font-weight:300;letter-spacing:-1.8px;color:#fff}
.h1 .w{display:inline-block}
.h1 em{font-style:normal;font-weight:700;background:linear-gradient(90deg,#80c2ff,#dbedff,#80c2ff) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.sub{position:absolute;left:0;right:0;top:440px;text-align:center;font-size:19px;line-height:28.5px;color:rgba(255,255,255,.62)}
.sub b{color:#fff;font-weight:600}
.note{position:absolute;left:0;right:0;top:804px;text-align:center;font-size:14px;line-height:17px;color:rgba(255,255,255,.5)}
.plate{position:absolute;left:370px;top:548px;width:700px;height:206px;border-radius:22px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)}
.ibox{position:absolute;left:340px;top:526px;width:760px;height:192px;border-radius:20px;background:rgba(5,31,61,.92);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 70px rgba(0,39,84,.35)}
.ibox::before{content:"";position:absolute;inset:-1px;border-radius:20px;padding:1px;pointer-events:none;
 background:conic-gradient(from var(--ang),rgba(20,122,242,.9),rgba(122,184,255,.95),rgba(139,123,255,.9),rgba(62,203,255,.9),rgba(20,122,242,.9));opacity:calc(.45 * (1 - var(--m, 0)));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}
.iin{position:absolute;left:18px;top:18px;width:722px;height:104px;border-radius:14px;background:rgba(255,255,255,.04)}
.iin .sp{position:absolute;left:18px;top:18px;font-size:15px;line-height:22.5px;font-weight:700;color:#8cbfff}
.iin .q{position:absolute;left:42px;top:18px;font-size:17px;line-height:25.5px;color:rgba(255,255,255,.92);white-space:nowrap}
.iin .ph{color:rgba(255,255,255,.38)}
.caret{display:inline-block;width:2px;height:22px;background:#147af2;vertical-align:-4px;margin-left:8px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.send{position:absolute;left:1045px;top:663px;width:36px;height:36px;border-radius:10px;pointer-events:none;box-shadow:0 0 0 0 rgba(140,191,255,.7)}
.send.go{animation:ping .7s ease-out}
@keyframes ping{from{box-shadow:0 0 0 0 rgba(140,191,255,.7)}to{box-shadow:0 0 0 16px rgba(140,191,255,0)}}
.wires{position:absolute;left:0;top:0;overflow:visible}
.wires path{fill:none;stroke:rgba(255,255,255,.28);stroke-width:1;stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset 1s ease .2s}
.wires.on path{stroke-dashoffset:0}
.wires circle{fill:#8cbfff;opacity:0;transition:opacity .4s ease 1s}
.wires.on circle{opacity:1}
.pulse{position:absolute;left:0;top:0;width:28px;height:2px;border-radius:2px;opacity:0;
 background:linear-gradient(90deg,transparent,#8cbfff,#fff);box-shadow:0 0 10px #7ab8ff;offset-rotate:auto}
.pulse.run{animation:travel .9s cubic-bezier(.5,0,.3,1) forwards}
@keyframes travel{0%{offset-distance:0%;opacity:0}15%{opacity:1}85%{opacity:1}100%{offset-distance:100%;opacity:0}}
.chip.lit img{filter:drop-shadow(0 0 12px rgba(122,184,255,.55)) brightness(1.25)}

/* 화면 켜짐 인트로: 빛줄기 깜빡이며 켜짐 → 격자가 가운데서 퍼짐 → 헤드라인 뒤 빛이 피어남 */
/* 원근 바닥 격자: 수평선에서 펼쳐진 뒤 앞으로 끝없이 흘러옴 */
.floor{position:absolute;left:-300px;width:2040px;top:514px;height:411px;perspective:380px;perspective-origin:50% 0;overflow:hidden;pointer-events:none;
 -webkit-mask:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent),linear-gradient(90deg,transparent 12%,#000 38%,#000 62%,transparent 88%);-webkit-mask-composite:source-in;
 mask:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent),linear-gradient(90deg,transparent 12%,#000 38%,#000 62%,transparent 88%);mask-composite:intersect}
.plane{position:absolute;left:0;right:0;top:0;height:2000px;transform-origin:50% 0;transform:rotateX(76deg);
 background-image:linear-gradient(to right,rgba(122,184,255,.44) 1px,transparent 1px),linear-gradient(to bottom,rgba(122,184,255,.44) 1px,transparent 1px);background-size:68px 68px;background-position:50% 0;
 animation:unfold 1.8s cubic-bezier(.2,.8,.2,1) .45s both,flow 2.4s linear infinite}
@keyframes unfold{from{transform:rotateX(90deg);opacity:0}to{transform:rotateX(76deg);opacity:1}}
@keyframes flow{to{background-position:50% 68px}}
.horizon{position:absolute;left:0;width:1440px;top:513px;height:2px;pointer-events:none;
 background:radial-gradient(closest-side,rgba(180,215,255,.95),rgba(122,184,255,.35) 40%,transparent);animation:fadeIn 1.4s ease .9s both}
.horizon::after{content:"";position:absolute;left:15%;right:15%;top:-60px;height:120px;background:radial-gradient(closest-side,rgba(20,122,242,.28),transparent);filter:blur(10px)}
.hero .beam.l{animation:beamOn 1.5s linear .1s both,swayL 11s ease-in-out 1.6s infinite alternate}
.hero .beam.r{animation:beamOn 1.5s linear .25s both,swayR 13s ease-in-out 1.75s infinite alternate}
@keyframes beamOn{0%{opacity:0}12%{opacity:.95}20%{opacity:.1}32%{opacity:.85}40%{opacity:.25}100%{opacity:.6}}
.hero .blob.drift1{animation:fadeIn 1.8s ease .4s both,drift1 16s ease-in-out infinite alternate}
.hero .blob.drift2{animation:fadeIn 1.8s ease .6s both,drift2 19s ease-in-out infinite alternate}
@keyframes fadeIn{from{opacity:0}}
.shock{position:absolute;left:620px;top:230px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(140,191,255,.7);
 box-shadow:0 0 30px rgba(122,184,255,.5),inset 0 0 30px rgba(122,184,255,.3);opacity:0;animation:shock 1.8s cubic-bezier(.15,.7,.3,1) .5s both;pointer-events:none}
@keyframes shock{0%{transform:scale(.1);opacity:0}15%{opacity:1}100%{transform:scale(7);opacity:0}}
.bloom{position:absolute;left:170px;top:60px;width:1100px;height:560px;pointer-events:none;
 background:radial-gradient(closest-side,rgba(122,184,255,.30),rgba(20,122,242,.10) 55%,transparent);animation:bloom 2.6s ease-out .7s both,breathe 7s ease-in-out 3.3s infinite alternate}
@keyframes bloom{0%{opacity:0;transform:scale(.6)}35%{opacity:1;transform:scale(1.05)}100%{opacity:.45;transform:none}}
@keyframes breathe{from{opacity:.45}to{opacity:.7}}
/* 헤드라인은 더 크게 흐릿했다가 내려앉으며 한 번 빛남 */
.hero .h1 .w.rv{transform:translateY(70px) scale(.9);filter:blur(26px)}
.hero .h1 .w.rv.vis{transform:none;filter:blur(0);animation:land 1.8s ease-out var(--ld,0s) both}
@keyframes land{0%,30%{text-shadow:0 0 0 rgba(140,191,255,0)}45%{text-shadow:0 0 36px rgba(140,191,255,.95),0 0 80px rgba(20,122,242,.6)}100%{text-shadow:0 0 0 rgba(140,191,255,0)}}

/* 입력창 층 (히어로 밖, 스크롤하면 답변 화면 속 입력창 자리로 이동) */
.fly{position:absolute;left:0;right:0;top:0;height:925px;z-index:40;pointer-events:none}
#flyg{position:absolute;inset:0;transform-origin:720px 87px}
.aura{position:absolute;left:340px;top:526px;width:760px;height:192px;border-radius:24px;opacity:0;transition:opacity 1s ease,transform 1s cubic-bezier(.16,.8,.2,1)}
.aura::before{content:"";position:absolute;inset:-4px;border-radius:26px;background:conic-gradient(from var(--ang),#147af2,#7ab8ff,#8b7bff,#3ecbff,#147af2);filter:blur(34px);animation:spin 7s linear infinite}
.aura.on{opacity:.5;animation:auraBreathe 4s ease-in-out infinite alternate}
@keyframes auraBreathe{from{opacity:.22}to{opacity:.36}}
.aura.typing{animation:none;opacity:.55;transform:scale(1.01)}
.aura.sent{animation:auraFlash 1.4s cubic-bezier(.2,.7,.2,1)}
@keyframes auraFlash{0%{opacity:.55}20%{opacity:.8;transform:scale(1.04);filter:brightness(1.3)}100%{opacity:.3;transform:none;filter:none}}
.ibox.rv:not(.vis){transform:translateY(70px) scale(.94)}
.ibox.vis{animation:ignite 2s ease-out 1.9s backwards}
@keyframes ignite{0%{box-shadow:0 20px 70px rgba(0,39,84,.35)}30%{box-shadow:0 0 0 1px rgba(140,191,255,.6),0 0 90px rgba(20,122,242,.7)}100%{box-shadow:0 20px 70px rgba(0,39,84,.35)}}

/* 답변 미리보기 카드 */
.ans{position:absolute;left:370px;top:728px;width:700px;height:168px;border-radius:16px;background:rgba(5,31,61,.94);border:1px solid rgba(255,255,255,.14);
 box-shadow:0 30px 60px rgba(0,0,0,.35);display:flex;gap:20px;padding:20px 22px;opacity:0;transform:translateY(-14px);clip-path:inset(0 0 100% 0 round 16px);
 transition:opacity .5s ease,transform .7s cubic-bezier(.16,.8,.2,1),clip-path .7s cubic-bezier(.16,.8,.2,1)}
.ans.open{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 16px)}
.ans-l{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.ans-t{font-size:15px;line-height:22px;font-weight:500;color:rgba(255,255,255,.92);display:flex;gap:8px}
.ans-t b{color:#8cbfff;font-size:13px}
.ans-sql{font:12px/18px ui-monospace,SFMono-Regular,Consolas,monospace;color:#8cbfff;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 10px;min-height:54px;word-break:break-all}
.ans-sql .caret{height:13px;vertical-align:-2px;margin-left:2px;width:1.5px}
.ans-src{font-size:12px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:8px}
.ans-src b{font-weight:500;color:rgba(255,255,255,.8);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:2px 10px}
.ans-c{width:260px;display:flex;align-items:flex-end;justify-content:space-between;padding:4px 4px 20px;position:relative}
.ans-c .bw{width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.ans-c .bar{width:100%;border-radius:6px 6px 2px 2px;background:rgba(122,184,255,.28);height:0;transition:height .9s cubic-bezier(.16,.8,.2,1)}
.ans-c .bar.hi{background:linear-gradient(180deg,#7ab8ff,#147af2);box-shadow:0 0 18px rgba(20,122,242,.6)}
.ans-c .bl{position:absolute;bottom:-18px;font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap}
.note{transition:opacity .4s}
.pin{position:relative}

.stage{position:sticky;top:0;overflow:hidden}

/* 답변 화면: 바뀌지 않는 부분은 Figma 이미지, 대화 영역은 HTML (좌표는 화면 1040x650 기준) */
.app{position:absolute;left:80px;top:50px;width:1040px;height:650px;pointer-events:none}
.app .cv{position:absolute}
.a-it{position:absolute;opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .6s cubic-bezier(.16,.8,.2,1)}
.a-it.show{opacity:1;transform:none}
.bubble{left:736px;top:52px;height:33px;padding:0 11px;display:flex;align-items:center;border-radius:12px;background:#f1f3f4;font-size:10.83px;color:#202124;white-space:nowrap;transform-origin:100% 100%}
.bubble:not(.show){transform:translateY(36px) scale(.9)}
.recent{left:17px;top:201px;font-size:10.11px;line-height:15px;color:#202124;white-space:nowrap}
.recent small{display:block;font-size:8.67px;line-height:12px;color:#80868b}
.status{left:345px;top:107px;display:flex;align-items:center;gap:5px;font-size:10.11px;line-height:15px;font-weight:500;color:#5e6369;white-space:nowrap}
.status .sd{width:6px;height:6px;border-radius:50%;background:#147af2;animation:sdp .8s ease-in-out infinite alternate}
.status.done .sd{background:#1aa666;animation:none}
@keyframes sdp{to{opacity:.2}}
.sqlbtn{left:845px;top:103px;width:56px;height:23px;border:1px solid rgba(232,235,237,.72);border-radius:6px;font-size:9.39px;font-weight:500;color:#147af2;display:flex;align-items:center;justify-content:center}
.atext{position:absolute;left:345px;top:138px;font-size:11.56px;line-height:17px;color:#212124;white-space:nowrap}
.atext b{font-weight:600}
.aw{opacity:0;filter:blur(4px);transition:opacity .35s,filter .35s}
.aw.show{opacity:1;filter:none}
.chart{left:345px;top:168px;width:556px;height:176px;border:1px solid rgba(232,235,237,.72);border-radius:9px}
.chart .ct{position:absolute;left:15px;top:16px;font-size:9.39px;line-height:14px;font-weight:600;color:#212124}
.chart .br{position:absolute;bottom:36px;width:95px;height:0;background:#ccdefa;transition:height .6s cubic-bezier(.16,.8,.2,1)}
.chart .br.hi{background:#147af2}
.chart .bl{position:absolute;top:146px;width:95px;text-align:center;font-size:8.67px;line-height:13px;color:#5e6369;opacity:0;transition:opacity .4s}
.chart.grown .bl{opacity:1}
.chip2{top:357px;height:24px;padding:0 9px;border:1px solid rgba(232,235,237,.72);border-radius:12px;font-size:9.39px;font-weight:500;color:#212124;display:flex;align-items:center;white-space:nowrap}
/* 떠 있는 카드는 답변 진행에 맞춰 나타남 */
.pop{opacity:0;transform:scale(.92) translateY(12px);filter:blur(8px);transition:opacity .6s ease,transform .8s cubic-bezier(.16,.8,.2,1),filter .6s}
.pop.show{opacity:1;transform:none;filter:none}
.pop.ping{animation:dbping 1.2s ease-in-out 2}
@keyframes dbping{50%{filter:drop-shadow(0 0 18px rgba(20,122,242,.6))}}
#flyg{transition:opacity .3s}
#flyg.gone{opacity:0!important}
.aura.off{opacity:0!important;animation:none!important}
.note.hide{opacity:0!important}
.chip img{transition:filter .5s}

/* 공통 배경 장식 */
.waves{position:absolute;left:50%;top:250px;width:max(1440px,100vw);height:200px;transform:translateX(-50%);overflow:visible}
.waves path{fill:none;stroke-width:1}
.floatwrap{position:absolute;will-change:transform}
.bob{animation:bob var(--bt,7s) ease-in-out infinite alternate}
@keyframes bob{from{translate:0 -6px}to{translate:0 8px}}
.screen{transform-origin:50% 0;will-change:transform}
.persp{position:absolute;inset:0;perspective:1800px}

/* 탭 */
.stack{position:absolute}
.stack img{position:absolute;left:0;top:0;width:100%;opacity:0;transition:opacity .6s ease,transform .8s cubic-bezier(.16,.8,.2,1),filter .6s}
.stack img.on{opacity:1}
.stack.panel img{transform:scale(.985) translateY(10px);filter:blur(6px)}
.stack.panel img.on{transform:none;filter:none}
.stack img:first-child{position:relative}
.hot{position:absolute;cursor:pointer;z-index:3}
.prog{position:absolute;height:2px;background:#004591;border-radius:2px;z-index:4;transform-origin:0 0;transform:scaleX(0)}
.prog.run{transition:transform linear;transform:scaleX(1)}

/* 보안: 데이터 흐름 */
