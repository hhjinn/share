  markPresets('redoFileSizeMb', inp.redoFileSizeMb);
  $$('[data-preset="redoFileSizeMb"]').forEach(b => { b.disabled = !redoOn; });
  setHint('redoFileSizeMb', redoOn ? 'Redo 볼륨 용량 자동 산정의 기준값. 입력 범위 1 MB 이상' : '');
}

function renderValidation(validation) {
  const all = Object.keys(validation.errors).concat(Object.keys(validation.warns));
  for (const key of all) {
    if (validation.errors[key]) setHint(key, validation.errors[key], 'error');
    else if (validation.warns[key]) setHint(key, validation.warns[key], 'warn');
  }
}

function renderResult(res) {
  const cfg = pricingConfig, m = cfg.meta;
  const hourlyEl = $('#totHourly'), monthlyEl = $('#totMonthly');
  if (res.ok) {
    hourlyEl.textContent = fmtMoney(res.totalHourly, m.hourlyDecimals, cfg); hourlyEl.className = 'val';
    monthlyEl.textContent = fmtMoney(res.totalMonthly, m.monthlyDecimals, cfg); monthlyEl.className = 'val';
  } else {
    hourlyEl.textContent = '계산 불가'; hourlyEl.className = 'val na';
    monthlyEl.textContent = '계산 불가'; monthlyEl.className = 'val na';
  }
  let alerts = '';
  if (res.inputErrors.length) alerts += `<div class="alert error"><b>입력값을 확인하세요.</b><ul>${res.inputErrors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
  if (res.priceErrors.length) alerts += `<div class="alert error"><b>가격 또는 규칙이 없어 계산할 수 없습니다.</b> 관리자 설정에서 아래 항목을 등록하세요.<ul>${res.priceErrors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
  if (res.warnings.length) alerts += `<div class="alert warn"><ul>${res.warnings.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`;
  $('#calcAlerts').innerHTML = alerts;

  // 구성 요약과 비용 구성 비율
  const inst = getInstance(inputs.instance, inputs.csp);
  const drText = inputs.drEnabled ? `DR Standby ${res.nodes.standby}${res.nodes.readOnly ? ` (Read Only ${res.nodes.readOnly})` : ''}` : 'DR 미사용';
  $('#cfgSummary').innerHTML = [
    `<b>${esc(getCsp(inputs.csp)?.name || inputs.csp)}</b>`, `${esc(inputs.dbType)} ${esc(inputs.edition)}`, esc(getLicenseType(inputs.licenseType)?.name || inputs.licenseType),
    `${esc(inputs.topology)} 기본 ${res.nodes.base} 노드`, esc(drText), inst ? esc(inst.name) : '인스턴스 미선택', `총 <b>${res.nodes.total}</b> 노드`
  ].map(t => `<span>${t}</span>`).join('');
  const comp = res.lines.filter(l => !l.excluded && l.hourly > 0);
  const compTotal = comp.reduce((s, l) => s + l.hourly, 0);
  $('#compWrap').hidden = !(res.ok && compTotal > 0);
  if (res.ok && compTotal > 0) {
    $('#compBar').innerHTML = comp.map(l => `<span style="width:${(l.hourly / compTotal * 100).toFixed(2)}%;background:${LINE_COLORS[l.key] || '#94a3b8'}" title="${esc(l.label)} ${(l.hourly / compTotal * 100).toFixed(1)}%"></span>`).join('');
    $('#compLegend').innerHTML = comp.map(l => `<span><i style="background:${LINE_COLORS[l.key] || '#94a3b8'}"></i>${esc(l.label)} ${(l.hourly / compTotal * 100).toFixed(1)}%</span>`).join('');
  }

  // 상세 내역 표 (제외 항목은 표에서 빼고 계산 근거에 이유만 표시)
  const shownLines = res.lines.filter(l => !l.excluded);
  const excludedLines = res.lines.filter(l => l.excluded);
  const rows = shownLines.map(l => `
    <tr class="${l.excluded ? 'excluded' : ''}">
      <td><b>${esc(l.label)}</b><span class="basis">${esc(l.basis)}</span></td>
      <td>${esc(l.qty)}</td>
      <td>${esc(l.unitPrice)}</td>
      <td class="num">${l.excluded ? '0' : esc(fmtMoney(l.hourly, m.hourlyDecimals, cfg))}</td>
      <td class="num">${l.excluded ? '0' : esc(fmtMoney(l.monthly, m.monthlyDecimals, cfg))}</td>
    </tr>`).join('');
  $('#breakdownTable').innerHTML = `
    <thead><tr><th>항목 / 적용 기준</th><th>수량</th><th>단가</th><th class="num">시간당</th><th class="num">월 (${fmtNum(res.H)}h)</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="5" class="empty">표시할 항목이 없습니다.</td></tr>`}
    <tr class="total"><td>합계${res.ok ? '' : ' (계산 불가 항목 제외, 참고용)'}</td><td></td><td></td><td class="num">${esc(fmtMoney(res.totalHourly, m.hourlyDecimals, cfg))}</td><td class="num">${esc(fmtMoney(res.totalMonthly, m.monthlyDecimals, cfg))}</td></tr></tbody>`;
  $('#breakdownCnt').textContent = `${shownLines.length}개 항목`;

  // 계산 근거
  const basis = shownLines.map(l => `
    <li><div class="t">${esc(l.label)}${l.excluded ? ' <span class="tag off">제외</span>' : ''}</div>
      <div class="n">적용 기준: ${esc(l.basis)}</div>
      <div class="f">${esc(l.formula)}${l.excluded ? '' : `\n= ${esc(fmtNum(l.rawHourly, 8))} /시간 → ${esc(fmtMoney(l.hourly, m.hourlyDecimals, cfg))} /시간, ${esc(fmtMoney(l.monthly, m.monthlyDecimals, cfg))} /월`}</div>
      ${l.parts ? `<div class="n">${l.parts.map(p => `${esc(p.label)}: ${esc(fmtNum(p.hour, 8))} /시간(1 세트)`).join(' , ')}</div>` : ''}
      ${l.notes && l.notes.length ? `<div class="n">메모: ${esc(l.notes.join(' / '))}</div>` : ''}
    </li>`).join('');
  const rules = res.rules.map(r => `<li><div class="t">${esc(r.title)}</div>${r.formula ? `<div class="f">${esc(r.formula)}</div>` : ''}${r.note ? `<div class="n">${esc(r.note)}</div>` : ''}</li>`).join('');
  $('#basisContent').innerHTML = `
    <dl class="kv" style="margin-bottom:12px">
      <dt>가격 기준일</dt><dd>${esc(pricingDate())}</dd>
      <dt>설정 이름</dt><dd>${esc(m.configName || '')}</dd>
      <dt>총 노드 수</dt><dd>${res.nodes.total} (기본 ${res.nodes.base}, Standby ${res.nodes.standby}, Read Only ${res.nodes.readOnly})</dd>
      <dt>월 환산 시간</dt><dd>${fmtNum(res.H)} 시간</dd>
    </dl>
    <h4 style="font-size:13px;margin:8px 0">항목별 계산식</h4><ul class="basis-list">${basis}</ul>
    ${excludedLines.length ? `<h4 style="font-size:13px;margin:8px 0">계산에서 제외된 항목</h4><ul class="basis-list">${excludedLines.map(l => `<li><div class="t">${esc(l.label)} <span class="tag off">제외</span></div><div class="n">${esc(l.basis)}</div></li>`).join('')}</ul>` : ''}
    <h4 style="font-size:13px;margin:8px 0">적용 규칙</h4><ul class="basis-list">${rules}</ul>`;
  $('#resultFoot').textContent = `가격 기준일 ${pricingDate()}, 설정 마지막 수정 ${fmtDateTime(m.updatedAt)}. 모든 금액은 ${m.currencyCode || ''} ${m.currencySymbol} 기준이며 세금은 포함되지 않았습니다.`;
}

function recalcAndRender() {
  renderHeader();
  renderForm();
  const res = calculate(inputs);
  renderValidation(res.validation);
  renderResult(res);
  saveInputs();
}

/* 입력 이벤트 */
/* CSP 와 구성 방식에 맞지 않는 스토리지 유형을 허용 목록의 첫 항목으로 바꿈 */
function applyStorageDefaults(inp) {
  const sts = effectiveStorageTypes(inp.csp);
  const allowed = topologyAllowedStorage(inp.topology);
  const ok = s => sts.some(x => x.code === s) && (!allowed || allowed.includes(s));
  const fallback = (sts.find(s => !allowed || allowed.includes(s.code)) || sts[0])?.code || '';
  for (const vd of VOLUME_DEFS) { const v = inp.volumes[vd.key]; if (!ok(v.type)) v.type = fallback; }
}

/* 선택 버튼(세그먼트) 값 변경 처리. 규칙이 바뀌는 필드는 기본값을 다시 적용 */
function onFieldChange(field, value) {
  const onRuleChange = () => { applyRuleDefaults(inputs, true); recalcAndRender(); };
  switch (field) {
    case 'csp': {
      inputs.csp = value;
      const allowedLt = cspAllowedLicenseTypes(inputs.csp); if (allowedLt && !allowedLt.includes(inputs.licenseType)) inputs.licenseType = allowedLt.find(id => getLicenseType(id)) || inputs.licenseType;
      const allowedDb = cspAllowedDbTypes(inputs.csp);
      if (allowedDb && !allowedDb.includes(inputs.dbType)) {
        inputs.dbType = allowedDb.find(id => getDbType(id)) || inputs.dbType;
        const allowedTopo = dbAllowedTopologies(inputs.dbType);
        if (allowedTopo && !allowedTopo.includes(inputs.topology)) inputs.topology = allowedTopo.find(id => getTopology(id)) || inputs.topology;
        const t = getTopology(inputs.topology);
        if (t) { const eds = splitList(t.allowedEditions); if (!eds.includes(inputs.edition) && eds.length) inputs.edition = eds[0]; }
      }
      const list = effectiveInstances(inputs.csp); if (!list.some(i => i.id === inputs.instance)) inputs.instance = (list.find(i => instanceHasPrice(i, inputs)) || list[0])?.id || '';
      applyStorageDefaults(inputs);
      onRuleChange(); break;
    }
    case 'dbType': {
      inputs.dbType = value;
      const allowed = dbAllowedTopologies(inputs.dbType);
      if (allowed && !allowed.includes(inputs.topology)) inputs.topology = allowed.find(id => getTopology(id)) || inputs.topology;
      const t = getTopology(inputs.topology);
      if (t) { const eds = splitList(t.allowedEditions); if (!eds.includes(inputs.edition) && eds.length) inputs.edition = eds[0]; }
      applyStorageDefaults(inputs);
      onRuleChange(); break;
    }
    case 'licenseType': inputs.licenseType = value; recalcAndRender(); break;
    case 'topology': {
      inputs.topology = value;
      const t = getTopology(inputs.topology);
      if (t) { const allowed = splitList(t.allowedEditions); if (!allowed.includes(inputs.edition) && allowed.length) inputs.edition = allowed[0]; }
      applyStorageDefaults(inputs);
      onRuleChange(); break;
    }
    case 'edition': inputs.edition = value; recalcAndRender(); break;
    case 'drEnabled': inputs.drEnabled = value === 'yes'; onRuleChange(); break;
    case 'instFamily': instFilter.family = value; renderInstancePicker(effectiveInstances(inputs.csp), inputs); break;
    default: {
      const m = field.match(/^(\w+)_type$/);
      if (m && inputs.volumes[m[1]]) { inputs.volumes[m[1]].type = value; recalcAndRender(); }
    }
  }
}

function bindFormEvents() {
  $('.forms').addEventListener('click', e => {
    const seg = e.target.closest('button[data-seg]');
    if (seg && !seg.disabled) { onFieldChange(seg.dataset.seg, seg.dataset.value); return; }
    const st = e.target.closest('button[data-stepper]');
    if (st && !st.disabled) {
      const el = $('#' + st.dataset.stepper);
      let v = (toNum(el.value) ?? 0) + Number(st.dataset.step);
      if (el.min !== '' && v < Number(el.min)) v = Number(el.min);
      if (el.max !== '' && v > Number(el.max)) v = Number(el.max);
      el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); return;
    }
    const pr = e.target.closest('button[data-preset]');
    if (pr && !pr.disabled) { const el = $('#' + pr.dataset.preset); el.value = pr.dataset.value; el.dispatchEvent(new Event('input', { bubbles: true })); return; }
    const ir = e.target.closest('button[data-inst]');
    if (ir) { inputs.instance = ir.dataset.inst; recalcAndRender(); }
  });
  $('#instSearch').addEventListener('input', e => { instFilter.q = e.target.value; renderInstancePicker(effectiveInstances(inputs.csp), inputs); });
  $('#btnResetInputs').addEventListener('click', () => {
    inputs = deepClone(DEFAULT_INPUTS);
    const list = effectiveInstances(inputs.csp); if (!list.some(i => i.id === inputs.instance)) inputs.instance = list[0]?.id || '';
    applyRuleDefaults(inputs, true); recalcAndRender();
  });
  $('#baseNodes').addEventListener('input', e => { inputs.baseNodes = toNum(e.target.value) ?? ''; recalcAndRender(); });
  $('#standbyNodes').addEventListener('input', e => { inputs.standbyNodes = toNum(e.target.value) ?? ''; recalcAndRender(); });
  $('#readOnlyNodes').addEventListener('input', e => { inputs.readOnlyNodes = toNum(e.target.value) ?? ''; recalcAndRender(); });
  $('#redoFileSizeMb').addEventListener('input', e => { inputs.redoFileSizeMb = toNum(e.target.value) ?? ''; recalcAndRender(); });
  $('#volumes').addEventListener('input', e => {
    const el = e.target; const vol = el.dataset.vol, prop = el.dataset.prop; if (!vol || !prop) return;
    const v = inputs.volumes[vol];
    if (prop === 'auto') v.auto = el.checked;
    else if (prop === 'type') v.type = el.value;
    else v[prop] = toNum(el.value) ?? '';
    recalcAndRender();
  });
}

/* ==========================================================================
 * 8. 관리자 설정 화면
 * ========================================================================== */
let adminSection = 'instances';
const ADMIN_EXTRA = [{ key: '__meta', group: '설정', title: '기본 설정' }, { key: '__json', group: '설정', title: 'JSON 관리' }];

function openAdmin() { $('#adminModal').hidden = false; renderAdmin(); document.body.style.overflow = 'hidden'; }
function closeAdmin() { $('#adminModal').hidden = true; document.body.style.overflow = ''; recalcAndRender(); }
function adminTouched() { saveConfig(true); recalcAndRender(); $('#adminUpdated').textContent = `마지막 수정 ${fmtDateTime(pricingConfig.meta.updatedAt)}`; $('#adminStatus').textContent = '저장됨'; }

function renderAdmin() {
  const conflicts = detectConflicts(pricingConfig);
  $('#adminUpdated').textContent = `마지막 수정 ${fmtDateTime(pricingConfig.meta.updatedAt)}`;
  const nav = $('#adminNav');
  const groups = {};
  [...TABLE_SECTIONS, ...ADMIN_EXTRA].forEach(s => (groups[s.group] = groups[s.group] || []).push(s));
  nav.innerHTML = Object.entries(groups).map(([g, list]) => `<div class="grp">${esc(g)}</div>` + list.map(s => {
    const n = conflicts.filter(c => c.section === s.key).length;
    return `<button type="button" data-sec="${esc(s.key)}" class="${s.key === adminSection ? 'active' : ''}">${esc(s.title)}${n ? `<span class="badge" title="경고 ${n}건">${n}</span>` : ''}</button>`;
  }).join('')).join('');
  $$('button', nav).forEach(b => b.addEventListener('click', () => { adminSection = b.dataset.sec; renderAdmin(); }));

  const content = $('#adminContent');
  if (adminSection === '__meta') return renderMetaEditor(content);
  if (adminSection === '__json') return renderJsonPanel(content);
  const sec = TABLE_SECTIONS.find(s => s.key === adminSection);
  renderTableEditor(content, sec, conflicts.filter(c => c.section === sec.key));
}

function renderConflicts(list) {
  if (!list.length) return '';
  return `<div class="alert warn conflicts"><b>경고 ${list.length}건: 중복 또는 충돌하는 항목이 있습니다.</b><ul>${list.map(c => `<li>${esc(c.message)}</li>`).join('')}</ul></div>`;
}

function cellInput(col, row, sec, idx) {
  const v = row[col.key];
  const name = `data-sec="${esc(sec.key)}" data-idx="${idx}" data-key="${esc(col.key)}"`;
  switch (col.type) {
    case 'checkbox': return `<input type="checkbox" ${name} ${v !== false && v !== undefined && v !== null ? 'checked' : ''}>`;
    case 'select': {
      let opts = [];
      try { opts = col.options(pricingConfig, row) || []; } catch (e) { opts = []; }
      const has = opts.some(o => o.value === v);
      return `<select ${name}>${has || isBlank(v) ? '' : `<option value="${esc(v)}" selected>${esc(v)} (목록에 없음)</option>`}${isBlank(v) ? '<option value="">선택</option>' : ''}${opts.map(o => `<option value="${esc(o.value)}" ${o.value === v ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    }
    case 'number': case 'int': return `<input type="number" ${name} value="${isBlank(v) ? '' : esc(v)}" step="${col.step || (col.type === 'int' ? 1 : 'any')}" ${col.min !== undefined ? `min="${col.min}"` : ''}>`;
    case 'date': return `<input type="date" ${name} value="${esc(v || '')}">`;
    default: return `<input type="text" ${name} value="${esc(v ?? '')}">`;
  }
}

function renderTableEditor(content, sec, conflicts) {
  const rows = pricingConfig[sec.key] || [];
  const dupIds = new Set(rows.map(r => r.id).filter((id, i, a) => a.indexOf(id) !== i));
  content.innerHTML = `
    <h3>${esc(sec.title)}</h3>
    <p class="admin-desc">${esc(sec.desc)}</p>
    ${renderConflicts(conflicts)}
    <div class="admin-toolbar">
      <button type="button" class="btn primary sm" id="btnAddRow">행 추가</button>
      <span style="font-size:12px;color:var(--muted)">${rows.length}개 항목. 셀을 수정하면 즉시 반영됩니다.</span>
    </div>
    <div class="admin-table-wrap"><table class="admin">
      <thead><tr><th>#</th>${sec.columns.map(c => `<th>${esc(c.label)}${c.required ? ' *' : ''}</th>`).join('')}<th></th></tr></thead>
      <tbody>${rows.length ? rows.map((row, i) => `<tr class="${dupIds.has(row.id) ? 'dup' : ''}"><td>${i + 1}</td>${sec.columns.map(c => `<td class="${c.type === 'checkbox' ? 'center' : (c.wide ? 'w-wide' : (c.type === 'text' ? 'w-text' : ''))}">${cellInput(c, row, sec, i)}</td>`).join('')}<td><button type="button" class="btn danger sm" data-del="${i}">삭제</button></td></tr>`).join('') : `<tr><td colspan="${sec.columns.length + 2}" class="empty">항목이 없습니다. "행 추가" 를 눌러 등록하세요.</td></tr>`}</tbody>
    </table></div>`;
  $('#btnAddRow', content).addEventListener('click', () => { pricingConfig[sec.key].push(sec.newRow(pricingConfig)); adminTouched(); renderAdmin(); });
  $$('[data-del]', content).forEach(b => b.addEventListener('click', () => {
    const i = Number(b.dataset.del); const row = pricingConfig[sec.key][i];
    if (!confirm(`'${row.id || (i + 1) + '번째 행'}' 항목을 삭제할까요?`)) return;
    pricingConfig[sec.key].splice(i, 1); adminTouched(); renderAdmin();
  }));
  const apply = (el, rerender) => {
    const { idx, key } = el.dataset; const col = sec.columns.find(c => c.key === key); const row = pricingConfig[sec.key][Number(idx)];
    if (!row || !col) return;
    if (col.type === 'checkbox') row[key] = el.checked;
    else if (col.type === 'number' || col.type === 'int') row[key] = toNum(el.value);
    else row[key] = el.value;
    adminTouched();
    if (rerender) renderAdmin();
  };
  content.addEventListener('input', e => { const el = e.target; if (el.dataset.key && el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'date') apply(el, false); });
  content.addEventListener('change', e => { const el = e.target; if (!el.dataset.key) return; if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'date') apply(el, true); else apply(el, false); });
  content.addEventListener('blur', e => { const el = e.target; if (el.dataset && el.dataset.key && el.tagName === 'INPUT' && el.type !== 'checkbox') renderAdmin(); }, true);
}

function renderMetaEditor(content) {
  const m = pricingConfig.meta;
  content.innerHTML = `
    <h3>기본 설정</h3>
    <p class="admin-desc">월 환산 시간, 통화, 반올림, 노드 산정 방식과 기준일을 관리합니다. 루트 볼륨 기본값은 "루트 볼륨" 메뉴에서 CSP별로 관리합니다.</p>
    <div class="meta-form">${META_FIELDS.map(f => {
      const v = m[f.key]; let input;
      if (f.type === 'checkbox') input = `<label class="checkline" style="min-height:36px"><input type="checkbox" data-meta="${f.key}" ${v ? 'checked' : ''}> ${v ? '사용' : '미사용'}</label>`;
      else if (f.type === 'select') input = `<select data-meta="${f.key}">${f.options().map(o => `<option value="${o.value}" ${o.value === v ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
      else if (f.type === 'number' || f.type === 'int') input = `<input type="number" data-meta="${f.key}" value="${isBlank(v) ? '' : esc(v)}" step="${f.type === 'int' ? 1 : 'any'}" ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''}>`;
      else if (f.type === 'date') input = `<input type="date" data-meta="${f.key}" value="${esc(v || '')}">`;
      else input = `<input type="text" data-meta="${f.key}" value="${esc(v ?? '')}">`;
      return `<div class="field"><label>${esc(f.label)}${f.required ? '<span class="req">*</span>' : ''}</label>${input}${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}</div>`;
    }).join('')}
    <div class="field"><label>마지막 수정 시각</label><input type="text" value="${esc(fmtDateTime(m.updatedAt))}" readonly><div class="help">설정을 변경하면 자동으로 갱신됩니다.</div></div>
    </div>`;
  const apply = el => {
    const key = el.dataset.meta; const f = META_FIELDS.find(x => x.key === key);
    if (f.type === 'checkbox') m[key] = el.checked;
    else if (f.type === 'number' || f.type === 'int') { const n = toNum(el.value); if (n === null) return; if (f.min !== undefined && n < f.min) return; if (f.max !== undefined && n > f.max) return; m[key] = f.type === 'int' ? Math.round(n) : n; }
    else { if (f.required && el.value === '') return; m[key] = el.value; }
    adminTouched();
  };
  content.addEventListener('input', e => { if (e.target.dataset.meta && e.target.type !== 'checkbox') apply(e.target); });
  content.addEventListener('change', e => { if (e.target.dataset.meta) { apply(e.target); if (e.target.type === 'checkbox') renderAdmin(); } });
}

function renderJsonPanel(content) {
  content.innerHTML = `
    <h3>JSON 관리</h3>
    <p class="admin-desc">현재 설정을 JSON 파일로 내보내거나, 다른 환경에서 만든 설정을 가져옵니다. 가져오기 전에 유효성 검사를 하며 오류가 있으면 적용하지 않습니다.</p>
    <div class="admin-toolbar">
      <button type="button" class="btn primary" id="btnExport">JSON 내보내기</button>
      <label class="btn" for="fileImport" style="display:inline-block">파일 선택</label><input type="file" id="fileImport" accept="application/json,.json" class="sr">
      <button type="button" class="btn" id="btnImport">가져오기 실행</button>
      <button type="button" class="btn danger" id="btnReset">기본 설정으로 복원</button>
    </div>
    <div id="jsonMsg"></div>
    <textarea class="json" id="jsonText" placeholder="여기에 설정 JSON 을 붙여 넣거나, 파일을 선택하세요. 내보내기를 누르면 현재 설정이 표시됩니다."></textarea>`;
  const msg = (html, cls) => { $('#jsonMsg', content).innerHTML = `<div class="alert ${cls}">${html}</div>`; };
  $('#btnExport', content).addEventListener('click', () => {
    const text = exportConfigJson(); $('#jsonText', content).value = text;
    try {
      const blob = new Blob([text], { type: 'application/json' }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `owldb-pricing-config-${pricingDate()}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      msg('현재 설정을 파일로 내보냈습니다. 아래 텍스트를 복사해 사용할 수도 있습니다.', 'ok');
    } catch (e) { msg('파일 저장을 시작할 수 없어 텍스트 영역에만 표시했습니다. 내용을 복사해 저장하세요.', 'warn'); }
  });
  $('#fileImport', content).addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { $('#jsonText', content).value = String(reader.result); msg(`파일 '${esc(file.name)}' 을 읽었습니다. "가져오기 실행" 을 눌러 적용하세요.`, 'ok'); };
    reader.readAsText(file, 'utf-8');
  });
  $('#btnImport', content).addEventListener('click', () => {
    const text = $('#jsonText', content).value.trim();
    if (!text) return msg('가져올 JSON 이 없습니다.', 'warn');
    const r = importConfigJson(text);
    if (!r.ok) return msg(`<b>가져오기 실패: 다음 오류를 수정하세요 (${r.errors.length}건)</b><ul>${r.errors.slice(0, 50).map(x => `<li>${esc(x)}</li>`).join('')}${r.errors.length > 50 ? '<li>이하 생략</li>' : ''}</ul>`, 'error');
    recalcAndRender(); renderAdmin();
    const c = detectConflicts(pricingConfig);
    $('#jsonMsg', $('#adminContent')).innerHTML = `<div class="alert ok">설정을 가져와 적용했습니다.${c.length ? ` 중복 또는 충돌 경고 ${c.length}건이 있으니 각 메뉴의 경고를 확인하세요.` : ''}</div>`;
  });
  $('#btnReset', content).addEventListener('click', () => {
    if (!confirm('현재 설정을 버리고 코드에 내장된 기본 설정으로 복원할까요? 이 작업은 되돌릴 수 없습니다. 필요하면 먼저 JSON 으로 내보내세요.')) return;
    resetConfig(); recalcAndRender(); renderAdmin();
    $('#jsonMsg', $('#adminContent')).innerHTML = `<div class="alert ok">기본 설정으로 복원했습니다.</div>`;
  });
}

/* ==========================================================================
 * 9. 초기화
 * ========================================================================== */
function init() {
  const loaded = loadConfig();
  loadInputs();
  buildVolumeBlocks();
  bindFormEvents();
  applyRuleDefaults(inputs, true);
  recalcAndRender();
  if (loaded.warning) { const a = document.createElement('div'); a.className = 'notice'; a.textContent = loaded.warning; $('.page').insertBefore(a, $('.layout')); }
  $('#btnAdmin').addEventListener('click', openAdmin);
  $('#btnAdminClose').addEventListener('click', closeAdmin);
  $('#adminModal').addEventListener('click', e => { if (e.target === $('#adminModal')) closeAdmin(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#adminModal').hidden) closeAdmin(); });
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
