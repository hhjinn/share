<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlDB 예상 비용 계산기</title>
<!--
  ============================================================================
  OwlDB 예상 비용 계산기 (단일 HTML, 외부 라이브러리와 CDN 의존성 없음)
  ============================================================================

  [가격 데이터 수정 방법]
  1) 화면 우측 상단 "관리자 설정" 버튼을 눌러 설정 패널을 엽니다.
  2) 왼쪽 메뉴에서 인스턴스, 스토리지 유형, IOPS 구간, Mbps 구간, 루트 볼륨, 라이선스 가격,
     구성 규칙(노드 구성 라벨 규칙, 구성 방식, DR 규칙, Redo 산정 규칙, 라이선스 유형 등), 기본 설정을 선택합니다.
     라이선스 가격은 "DB 유형 + 구성 라벨(예: Single(SE), EE + TAC, HA(EE)) + 가격 종류 + vCPU" 별 노드당 시간 단가이며,
     어떤 노드에 어떤 구성 라벨을 적용할지는 "노드 구성 라벨 규칙"에서 노드 역할(기본, 복구용 Standby, Read Only Standby)별로 정합니다.
  3) 표의 셀을 직접 수정하거나 "행 추가", "삭제" 버튼으로 항목을 관리합니다.
     변경 내용은 즉시 계산에 반영되고 브라우저 로컬 저장소(localStorage)에 자동 저장됩니다.
  4) 코드에서 직접 바꾸려면 아래 스크립트의 DEFAULT_PRICING_CONFIG 객체만 수정합니다.
     계산 로직 안에는 가격 숫자가 없으며, 모든 가격과 규칙은 이 객체(pricingConfig) 하나로 관리됩니다.
     각 가격 항목은 id, 적용 조건, 단가, 단위, startDate, endDate, memo, active 필드를 가지며
     기준일(meta.pricingDate)에 유효하고 active 가 true 인 항목만 계산에 사용됩니다.

  [JSON 가져오기와 내보내기 방법]
  - 내보내기: 관리자 설정 > "JSON 관리" > "JSON 내보내기". 파일로 저장되고 텍스트 영역에도 표시됩니다.
  - 가져오기: 관리자 설정 > "JSON 관리" 에서 파일을 선택하거나 텍스트 영역에 JSON 을 붙여 넣은 뒤
    "가져오기 실행" 을 누릅니다. 유효성 검사를 통과한 경우에만 적용되며 오류가 있으면 이유를 표시합니다.
  - "기본 설정으로 복원" 은 코드에 내장된 DEFAULT_PRICING_CONFIG 로 되돌립니다.
  ============================================================================
-->
<style>
  :root{
    --bg:#f3f5f8; --card:#ffffff; --border:#d8dee8; --border-strong:#b9c2d0;
    --text:#1e2633; --muted:#667085; --primary:#1f4e9a; --primary-dark:#173d7a; --primary-soft:#e8eef8;
    --danger:#b42318; --danger-bg:#fef3f2; --danger-border:#f2b8b5;
    --warn:#9a5b00; --warn-bg:#fff8e6; --warn-border:#f5d78e;
    --ok:#067647; --ok-bg:#ecfdf3; --ok-border:#a6e9c3;
    --radius:8px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  h1,h2,h3,h4{margin:0;font-weight:600}
  button,input,select,textarea{font:inherit;color:inherit}
  [hidden]{display:none !important}
  a{color:var(--primary)}

  .topbar{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .topbar-inner{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{background:var(--primary);color:#fff;font-weight:700;letter-spacing:.3px;border-radius:6px;padding:4px 9px;font-size:13px}
  .brand h1{font-size:18px}
  .topbar-meta{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#f8fafc;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
  .chip b{color:var(--text);font-weight:600}
  .chip.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn)}
  .btn{border:1px solid var(--border-strong);background:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.3;white-space:nowrap}
  .btn:hover{background:#f4f6fa}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-dark)}
  .btn.danger{color:var(--danger);border-color:var(--danger-border)}
  .btn.danger:hover{background:var(--danger-bg)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .page{max-width:1360px;margin:0 auto;padding:20px}
  .notice{border:1px solid var(--warn-border);background:var(--warn-bg);color:var(--warn);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:13px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px;align-items:start}
  .layout > *{min-width:0}
  @media (max-width:1080px){.layout{grid-template-columns:minmax(0,1fr)}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
  .card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .card-head h2{font-size:15px}
  .card-head .step{background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:12px;border-radius:6px;padding:2px 8px}
  .card-body{padding:16px 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 16px}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .field label .req{color:var(--danger);margin-left:2px}
  .field input,.field select{width:100%;border:1px solid var(--border-strong);border-radius:6px;padding:7px 10px;background:#fff;min-height:36px}
  .field input:focus,.field select:focus{outline:2px solid rgba(31,78,154,.25);border-color:var(--primary)}
  .field input:disabled,.field select:disabled,.field input[readonly]{background:#f1f3f6;color:#7c8594;cursor:not-allowed}
  .field.invalid input,.field.invalid select{border-color:var(--danger);background:#fff8f7}
  .hint{font-size:12px;color:var(--muted);min-height:16px}
  .hint.error{color:var(--danger)}
  .hint.warn{color:var(--warn)}
  .hint.info{color:var(--primary)}
  .checkline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
  .checkline input{width:auto;min-height:auto}
  /* 계산기형 입력 컴포넌트 */
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{border:1px solid var(--border-strong);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;min-height:36px;flex:1 1 auto;min-width:0;line-height:1.25}
  .seg button:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
  .seg button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .seg button:disabled{background:#f1f3f6;color:#a0a8b5;cursor:not-allowed}
  .seg button .sub{display:block;font-size:11px;font-weight:400;opacity:.85}
  .seg button.on .sub{color:#e6edf8}
  .stepper{display:flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;background:#fff}
  .stepper button{border:0;background:#f4f6fa;width:40px;cursor:pointer;font-size:18px;color:var(--primary);flex-shrink:0}
  .stepper button:hover:not(:disabled){background:var(--primary-soft)}
  .stepper button:disabled{color:#b8bfcc;cursor:not-allowed;background:#f1f3f6}
  .field .stepper input{border:0;border-radius:0;text-align:center;flex:1;min-width:0;font-weight:600;font-size:15px}
  .field .stepper input:focus{outline:none}
  .field.invalid .stepper{border-color:var(--danger)}
  .presets{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .presets button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:1px 8px;font-size:11px;cursor:pointer;color:var(--muted);line-height:1.5}
  .presets button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
  .presets button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
  .presets button:disabled{opacity:.45;cursor:not-allowed}
  .instpicker{border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;background:#fff}
  .field.invalid .instpicker{border-color:var(--danger)}
  .instfilter{display:flex;gap:8px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--border);background:#f8fafc;align-items:center}
  .field .instfilter input{flex:1 1 200px;min-height:32px;padding:5px 10px;width:auto}
  .seg.small{gap:4px}
  .seg.small button{padding:3px 10px;min-height:28px;font-size:12px;flex:0 0 auto}
  .instlist{max-height:250px;overflow-y:auto;position:relative}
  .instrow{display:grid;grid-template-columns:minmax(0,1.6fr) 64px 92px 112px;gap:8px;align-items:center;padding:7px 12px;border:0;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;width:100%;background:#fff;text-align:left;line-height:1.3}
  .instrow:hover{background:var(--primary-soft)}
  .instrow.on{background:var(--primary);color:#fff;font-weight:600}
  .instrow .mut{color:var(--muted);font-size:11.5px;font-weight:400;margin-left:4px}
  .instrow.on .mut{color:#dbe4f3}
  .instrow.nop{color:#a0a8b5;background:#fafbfc}
  .instrow.nop .mut{color:var(--warn)}
  .instrow .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .instrow .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .instrow.head{background:#f5f7fa;color:var(--muted);font-size:11.5px;font-weight:600;cursor:default;position:sticky;top:0;z-index:1}
  .instrow.head:hover{background:#f5f7fa}
  @media (max-width:560px){.instrow{grid-template-columns:minmax(0,1fr) 46px 70px 84px;font-size:12px;padding:7px 8px;gap:6px}}
  .instinfo{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .instinfo span{font-size:12px;background:#f4f6fa;border-radius:4px;padding:2px 8px;color:var(--text)}
  .nodeviz{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center;padding-top:12px;border-top:1px dashed var(--border)}
  .node{border:1px solid var(--border-strong);border-radius:6px;padding:5px 10px;font-size:12px;background:#fff;min-width:78px;text-align:center;font-weight:600}
  .node small{display:block;font-size:10.5px;font-weight:400;color:var(--muted)}
  .node.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
  .node.standby{border-style:dashed;color:var(--text)}
  .node.ro{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
  .node.ro small{color:var(--ok)}
  .nodeviz .sum{font-size:12.5px;color:var(--muted);margin-left:auto;font-weight:600}
  .summary{padding:10px 18px;border-bottom:1px solid var(--border);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px}
  .summary span{background:#f4f6fa;border-radius:4px;padding:2px 8px;color:var(--text)}
  .summary span b{color:var(--primary)}
  .compbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#eef1f5;margin:14px 18px 8px}
  .compbar span{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 18px 12px;font-size:11.5px;color:var(--muted)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .subhead{font-size:13px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .volume{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:#fbfcfe}
  .volume.disabled{background:#f4f5f7}
  .volume .banner{font-size:12px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:6px;padding:6px 10px;margin-bottom:10px}
  .tag{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;background:#eef2f7;color:var(--muted);font-weight:600}
  .tag.off{background:#fde8e8;color:var(--danger)}
  .tag.auto{background:var(--primary-soft);color:var(--primary)}

  .result{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow-y:auto;scrollbar-width:thin}
  .result .card{margin-bottom:0}
  @media (max-width:1080px){.result{position:static;max-height:none;overflow:visible}}
  .totals{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
  .total{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:#fbfcfe;min-width:0}
  .total .lbl{font-size:12px;color:var(--muted);font-weight:600}
  .total .val{font-size:22px;font-weight:700;margin-top:4px;word-break:break-all;letter-spacing:-.2px}
  .total .val.na{font-size:16px;color:var(--danger)}
  .total .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .alerts{padding:12px 18px 0}
  .alert{border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:10px;border:1px solid}
  .alert.error{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
  .alert.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn)}
  .alert.ok{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
  .alert ul{margin:6px 0 0;padding-left:18px}
  .alert li{margin:2px 0}
  details.section{border-top:1px solid var(--border)}
  details.section summary{cursor:pointer;padding:12px 18px;font-weight:600;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
  details.section summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-left:2px}
  details.section[open] summary::before{transform:rotate(45deg)}
  details.section summary .cnt{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
  details.section .content{padding:0 18px 16px}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px}
  table.breakdown{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
  table.breakdown th,table.breakdown td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  table.breakdown th{background:#f5f7fa;font-weight:600;color:var(--muted);white-space:nowrap;font-size:12px}
  table.breakdown td.num,table.breakdown th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.breakdown tr.total td{font-weight:700;background:#f8fafc;border-top:2px solid var(--border-strong)}
  table.breakdown tr.excluded td{color:#8a93a3}
  table.breakdown .basis{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}
  .basis-list{list-style:none;margin:0;padding:0}
  .basis-list li{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;background:#fbfcfe}
  .basis-list .t{font-weight:600;font-size:13px;margin-bottom:4px}
  .basis-list .f{font-family:Consolas,"Courier New",monospace;font-size:12px;background:#f1f3f6;border-radius:4px;padding:6px 8px;margin:4px 0;white-space:pre-wrap;word-break:break-all}
  .basis-list .n{font-size:12px;color:var(--muted)}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:12.5px;margin:0}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0}
  .footnote{font-size:11.5px;color:var(--muted);padding:0 18px 14px}

  /* 관리자 설정 모달 */
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal-panel{background:var(--card);border-radius:10px;width:min(1280px,100%);height:min(92vh,900px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
  .modal-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .modal-head h2{font-size:16px}
  .modal-head .spacer{flex:1}
  .modal-body{flex:1;display:flex;min-height:0}
  .admin-nav{width:200px;border-right:1px solid var(--border);overflow-y:auto;background:#f8fafc;padding:8px;flex-shrink:0}
  .admin-nav .grp{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:10px 10px 4px}
  .admin-nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px}
  .admin-nav button:hover{background:#eef2f7}
  .admin-nav button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .admin-nav button .badge{float:right;background:var(--warn);color:#fff;border-radius:999px;font-size:10px;padding:0 6px;line-height:16px}
  .admin-content{flex:1;overflow:auto;padding:18px 20px;min-width:0}
  .admin-content h3{font-size:15px;margin-bottom:4px}
  .admin-desc{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .admin-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .admin-table-wrap{overflow:auto;border:1px solid var(--border);border-radius:6px;max-width:100%}
  table.admin{border-collapse:collapse;font-size:12.5px;min-width:100%}
  table.admin th,table.admin td{border-bottom:1px solid var(--border);padding:5px 6px;text-align:left;vertical-align:middle;white-space:nowrap}
  table.admin th{background:#f5f7fa;position:sticky;top:0;z-index:1;font-size:12px;color:var(--muted);font-weight:600}
  table.admin td input[type=text],table.admin td input[type=number],table.admin td input[type=date],table.admin td select{border:1px solid var(--border);border-radius:4px;padding:4px 6px;min-width:80px;width:100%;background:#fff}
  table.admin td input[type=number]{min-width:90px;text-align:right}
  table.admin td input[type=date]{min-width:130px}
  table.admin td.w-text input{min-width:140px}
  table.admin td.w-wide input{min-width:240px}
  table.admin td input:focus,table.admin td select:focus{outline:2px solid rgba(31,78,154,.25);border-color:var(--primary)}
  table.admin td.center{text-align:center}
  table.admin tr.dup td{background:#fff8f7}
  .meta-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px 18px;max-width:900px}
  .meta-form .help{font-size:11.5px;color:var(--muted)}
  .modal-foot{padding:10px 20px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  textarea.json{width:100%;min-height:260px;font-family:Consolas,"Courier New",monospace;font-size:12px;border:1px solid var(--border-strong);border-radius:6px;padding:10px;resize:vertical}
  .conflicts{margin-bottom:12px}
  .empty{color:var(--muted);font-size:13px;padding:14px;text-align:center}
  @media (max-width:760px){
    .modal{padding:0}.modal-panel{height:100vh;border-radius:0}
    .modal-body{flex-direction:column}
    .admin-nav{width:100%;border-right:0;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:6px;gap:2px}
    .admin-nav .grp{display:none}
    .admin-nav button{width:auto;white-space:nowrap}
    .totals{grid-template-columns:1fr}
    .topbar-meta{margin-left:0;width:100%}
  }
  .sr{position:absolute;left:-9999px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="logo">OwlDB</span><h1>예상 비용 계산기</h1></div>
    <div class="topbar-meta">
      <span class="chip" id="chipDate">기준일 <b>...</b></span>
      <span class="chip" id="chipUpdated">마지막 수정 <b>...</b></span>
      <button class="btn primary" id="btnAdmin" type="button">관리자 설정</button>
    </div>
  </div>
</header>

<div class="page">
  <div class="layout">
    <section class="forms">

      <div class="card">
        <div class="card-head"><span class="step">1</span><h2>엔진 및 인스턴스</h2><button class="btn sm" id="btnResetInputs" type="button" style="margin-left:auto">입력 초기화</button></div>
        <div class="card-body">
          <div class="grid">
            <div class="field" data-field="csp"><label>사용 CSP<span class="req">*</span></label><div class="seg" id="csp"></div><div class="hint"></div></div>
            <div class="field" data-field="dbType"><label>DB 유형<span class="req">*</span></label><div class="seg" id="dbType"></div><div class="hint"></div></div>
            <div class="field" data-field="licenseType" style="grid-column:1/-1"><label>라이선스 유형<span class="req">*</span></label><div class="seg" id="licenseType"></div><div class="hint"></div></div>
            <div class="field" data-field="topology"><label>구성 방식<span class="req">*</span></label><div class="seg" id="topology"></div><div class="hint"></div></div>
            <div class="field" data-field="edition"><label>에디션<span class="req">*</span></label><div class="seg" id="edition"></div><div class="hint"></div></div>
            <div class="field" data-field="baseNodes"><label for="baseNodes">기본 노드 수<span class="req">*</span></label>
              <div class="stepper"><button type="button" data-stepper="baseNodes" data-step="-1" aria-label="감소">-</button><input id="baseNodes" type="number" min="1" step="1"><button type="button" data-stepper="baseNodes" data-step="1" aria-label="증가">+</button></div><div class="hint"></div></div>
            <div class="field" data-field="instance" style="grid-column:1/-1"><label for="instSearch">인스턴스 타입<span class="req">*</span></label>
              <div class="instpicker">
                <div class="instfilter"><input id="instSearch" type="search" placeholder="인스턴스명 또는 vCPU 검색 (예: r6i, 8)" autocomplete="off"><div class="seg small" id="instFamily"></div></div>
                <div class="instlist" id="instList" role="listbox"></div>
              </div>
              <div class="instinfo" id="instInfo"></div><div class="hint"></div></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="step">2</span><h2>DR 구성</h2></div>
        <div class="card-body">
          <div class="grid">
            <div class="field" data-field="drEnabled"><label>DR 사용 여부</label><div class="seg" id="drEnabled"></div><div class="hint"></div></div>
            <div class="field" data-field="standbyNodes"><label for="standbyNodes">Standby 노드 수</label>
              <div class="stepper"><button type="button" data-stepper="standbyNodes" data-step="-1" aria-label="감소">-</button><input id="standbyNodes" type="number" min="0" step="1"><button type="button" data-stepper="standbyNodes" data-step="1" aria-label="증가">+</button></div><div class="hint"></div></div>
            <div class="field" data-field="readOnlyNodes"><label for="readOnlyNodes">Read Only 노드 수 (Standby 중)</label>
              <div class="stepper"><button type="button" data-stepper="readOnlyNodes" data-step="-1" aria-label="감소">-</button><input id="readOnlyNodes" type="number" min="0" step="1"><button type="button" data-stepper="readOnlyNodes" data-step="1" aria-label="증가">+</button></div><div class="hint"></div></div>
          </div>
          <div class="nodeviz" id="nodeViz"></div>
          <div class="hint" id="drRuleHint" style="margin-top:8px"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="step">3</span><h2>스토리지 구성</h2></div>
        <div class="card-body">
          <div id="volumes"></div>
          <div class="hint info" id="volumeNotice" hidden></div>
        </div>
      </div>

    </section>

    <aside class="result">
      <div class="card">
        <div class="card-head"><h2>예상 비용 결과</h2><span class="chip" id="chipCurrency" style="margin-left:auto"></span></div>
        <div class="summary" id="cfgSummary"></div>
        <div class="totals">
          <div class="total"><div class="lbl">시간당 예상 소비자 가격</div><div class="val" id="totHourly">...</div><div class="sub">세부 내역 시간당 금액의 합계</div></div>
          <div class="total"><div class="lbl">월 예상 소비자 가격</div><div class="val" id="totMonthly">...</div><div class="sub" id="totMonthlySub">월 환산 730시간 기준</div></div>
        </div>
        <div id="compWrap" hidden><div class="compbar" id="compBar"></div><div class="legend" id="compLegend"></div></div>
        <div class="alerts" id="calcAlerts"></div>
        <details class="section">
          <summary>비용 구성 상세 내역<span class="cnt" id="breakdownCnt"></span></summary>
          <div class="content"><div class="table-wrap"><table class="breakdown" id="breakdownTable"></table></div></div>
        </details>
        <details class="section" id="basisDetails">
          <summary>계산 근거 (적용 기준, 계산식, 규칙)</summary>
          <div class="content" id="basisContent"></div>
        </details>
        <div class="footnote" id="resultFoot"></div>
      </div>
    </aside>
  </div>
</div>

<!-- 관리자 설정 모달 -->
<div class="modal" id="adminModal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
    <div class="modal-head">
      <h2 id="adminTitle">관리자 설정</h2>
      <span class="chip" id="adminUpdated"></span>
      <span class="spacer"></span>
      <button class="btn" id="btnAdminClose" type="button">닫기</button>
    </div>
    <div class="modal-body">
      <nav class="admin-nav" id="adminNav"></nav>
      <div class="admin-content" id="adminContent"></div>
    </div>
    <div class="modal-foot">
      <span>변경 사항은 즉시 계산에 반영되고 이 브라우저의 로컬 저장소에 자동 저장됩니다.</span>
      <span class="spacer" style="flex:1"></span>
      <span id="adminStatus"></span>
    </div>
  </div>
</div>

const $  = (sel, root = document) => root.querySelector(sel);

const deepClone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2, '0');
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function nowIso() { const d = new Date(); return `${todayStr()}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }
function fmtDateTime(iso) { if (!iso) return '기록 없음'; return String(iso).replace('T', ' ').slice(0, 16); }
function isBlank(v) { return v === undefined || v === null || v === ''; }
function toNum(v) { if (isBlank(v)) return null; const n = Number(v); return Number.isFinite(n) ? n : null; }
function splitList(s) { return String(s ?? '').split(',').map(x => x.trim()).filter(Boolean); }
function matchWild(ruleVal, val) { return isBlank(ruleVal) || ruleVal === '*' || ruleVal === val; }
function isEffective(item, date) {
  if (item.active === false) return false;

}

  const bs = b.startDate || '0000-00-00', be = b.endDate || '9999-99-99';
  return as <= be && bs <= ae;
}
function roundTo(v, decimals, mode) {
  const f = Math.pow(10, decimals), x = v * f, eps = 1e-9;
  let r;
  if (mode === 'ceil') r = Math.ceil(x - eps);
  else if (mode === 'floor') r = Math.floor(x + eps);
  else r = Math.round(x);

}

}

/* 안전한 수식 계산: 허용된 변수와 Math 함수만 사용 가능 */
const FORMULA_FUNCS = { max: Math.max, min: Math.min, ceil: Math.ceil, floor: Math.floor, round: Math.round, abs: Math.abs, pow: Math.pow, sqrt: Math.sqrt };
function evalFormula(formula, vars) {
  const src = String(formula || '').trim();
  if (!src) throw new Error('규칙식이 비어 있습니다.');
  if (/[^A-Za-z0-9_\s+\-*/().,%]/.test(src)) throw new Error('규칙식에 허용되지 않은 문자가 있습니다. 숫자, 사칙연산, 괄호, 변수명만 사용할 수 있습니다.');
  const ids = src.match(/[A-Za-z_][A-Za-z0-9_]*/g) || [];
  for (const id of ids) if (!(id in vars) && !(id in FORMULA_FUNCS)) throw new Error(`규칙식에 알 수 없는 변수 또는 함수 '${id}' 가 있습니다.`);
  const names = [...Object.keys(vars), ...Object.keys(FORMULA_FUNCS)];
  const values = [...Object.values(vars), ...Object.values(FORMULA_FUNCS)];
  const fn = new Function(...names, `"use strict"; return (${src});`);
  const r = fn(...values);
  if (typeof r !== 'number' || !Number.isFinite(r)) throw new Error('규칙식 계산 결과가 숫자가 아닙니다.');
  return r;
}

/* ==========================================================================
 * 3. 설정 데이터 관리 (불러오기, 저장, 유효성 검사, 충돌 검사, JSON)
 * ========================================================================== */
let pricingConfig = deepClone(DEFAULT_PRICING_CONFIG);
let inputs = deepClone(DEFAULT_INPUTS);

function validateConfig(cfg) {
  const errors = [];
  if (!cfg || typeof cfg !== 'object' || Array.isArray(cfg)) return ['최상위 값이 JSON 객체가 아닙니다.'];
  if (!cfg.meta || typeof cfg.meta !== 'object') errors.push('meta 객체가 없습니다.');
  else {
    for (const f of META_FIELDS) {
      const v = cfg.meta[f.key];
      if (f.required && isBlank(v)) { errors.push(`meta.${f.key} (${f.label}) 값이 필요합니다.`); continue; }
      if (isBlank(v)) continue;
      errors.push(...checkValue(v, f, `meta.${f.key} (${f.label})`, cfg, null));
    }
  }
  for (const sec of TABLE_SECTIONS) {
    const rows = cfg[sec.key];
    if (!Array.isArray(rows)) { errors.push(`${sec.title} (${sec.key}) 배열이 없습니다.`); continue; }
    const ids = new Set();
    rows.forEach((row, i) => {
      const where = `${sec.title} ${i + 1}번째 행`;
      if (!row || typeof row !== 'object') { errors.push(`${where}: 객체가 아닙니다.`); return; }
      for (const col of sec.columns) {
        const v = row[col.key];
        if (col.required && isBlank(v)) { errors.push(`${where}: '${col.label}' 값이 필요합니다.`); continue; }
        if (isBlank(v)) continue;
        errors.push(...checkValue(v, col, `${where} '${col.label}'`, cfg, row));
      }
      if (!isBlank(row.id)) { if (ids.has(row.id)) errors.push(`${where}: ID '${row.id}' 가 중복됩니다.`); ids.add(row.id); }
    });
  }
  return errors;
}
function checkValue(v, col, where, cfg, row) {
  const errs = [];
  switch (col.type) {
    case 'number': case 'int':
      if (typeof v !== 'number' || !Number.isFinite(v)) errs.push(`${where}: 숫자여야 합니다. (현재: ${JSON.stringify(v)})`);
      else {
        if (col.type === 'int' && !Number.isInteger(v)) errs.push(`${where}: 정수여야 합니다. (현재: ${v})`);
        if (col.min !== undefined && v < col.min) errs.push(`${where}: ${col.min} 이상이어야 합니다. (현재: ${v})`);
        if (col.max !== undefined && v > col.max) errs.push(`${where}: ${col.max} 이하여야 합니다. (현재: ${v})`);
      }
      break;
    case 'date':
      if (typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) errs.push(`${where}: 날짜는 YYYY-MM-DD 형식이어야 합니다. (현재: ${JSON.stringify(v)})`);
      break;
    case 'checkbox':
      if (typeof v !== 'boolean') errs.push(`${where}: true 또는 false 여야 합니다. (현재: ${JSON.stringify(v)})`);
      break;
    case 'select': {
      let opts = [];
      try { opts = col.options(cfg, row) || []; } catch (e) { opts = null; }
      if (opts && !opts.some(o => o.value === v)) errs.push(`${where}: 허용되지 않은 값 '${v}' 입니다. 허용: ${opts.map(o => o.value).join(', ') || '(없음)'}`);
      break;
    }
    default:
      if (typeof v !== 'string' && typeof v !== 'number') errs.push(`${where}: 문자열이어야 합니다.`);
  }
  return errs;
}

/* 중복, 충돌 검사. 결과는 관리자 화면에 경고로 표시 */
function detectConflicts(cfg) {
  const out = []; // {section, message}
  const add = (section, message) => out.push({ section, message });
  const activeOf = key => (cfg[key] || []).filter(r => r.active !== false);

  // ID 중복
  for (const sec of TABLE_SECTIONS) {
    const seen = {};
    (cfg[sec.key] || []).forEach(r => { seen[r.id] = (seen[r.id] || 0) + 1; });
    Object.entries(seen).filter(([, n]) => n > 1).forEach(([id]) => add(sec.key, `ID '${id}' 가 ${seen[id]}개 있습니다.`));
  }
  // 인스턴스: 같은 CSP 와 이름이 기간 중복
  pairwise(activeOf('instances'), (a, b) => a.csp === b.csp && a.name.trim().toLowerCase() === b.name.trim().toLowerCase() && datesOverlap(a, b),
    (a, b) => add('instances', `인스턴스 '${a.name}' (${a.csp}) 가격이 '${a.id}' 와 '${b.id}' 에서 기간이 겹칩니다.`));
  pairwise(activeOf('storageTypes'), (a, b) => a.csp === b.csp && a.code === b.code && datesOverlap(a, b),
    (a, b) => add('storageTypes', `스토리지 유형 '${a.code}' (${a.csp}) 가 '${a.id}' 와 '${b.id}' 에서 기간이 겹칩니다.`));
  pairwise(activeOf('rootVolumeRules'), (a, b) => a.csp === b.csp && datesOverlap(a, b),
    (a, b) => add('rootVolumeRules', `루트 볼륨 규칙 '${a.id}' 와 '${b.id}' 가 같은 CSP(${a.csp}) 에서 기간이 겹칩니다.`));
  for (const key of ['iopsTiers', 'mbpsTiers']) {
    const rows = activeOf(key);
    pairwise(rows, (a, b) => a.csp === b.csp && a.storageType === b.storageType && datesOverlap(a, b) && rangeOverlap(a.from, a.to, b.from, b.to),
      (a, b) => add(key, `구간 '${a.id}' 와 '${b.id}' (${a.csp}/${a.storageType}) 의 범위가 겹칩니다.`));
    const groups = {};
    rows.forEach(r => { const g = `${r.csp}/${r.storageType}`; (groups[g] = groups[g] || []).push(r); });
    for (const [g, list] of Object.entries(groups)) {
      if (!list.some(r => Number(r.from) === 0)) add(key, `${g} 구간에 0 부터 시작하는 구간이 없습니다.`);
      if (!list.some(r => isBlank(r.to))) add(key, `${g} 구간에 무제한(종료 빈칸) 구간이 없어 큰 사용량은 계산할 수 없습니다.`);
    }
  }
  const LIC_FIELDS = ['dbType', 'licenseType'], NCR_FIELDS = ['dbType', 'topology', 'edition', 'nodeRole'];
  pairwise(activeOf('licensePrices'), (a, b) =>
      a.priceKind === b.priceKind && String(a.config).trim() === String(b.config).trim() && Number(a.vcpu) === Number(b.vcpu) && datesOverlap(a, b) &&
      wildCompatible(a.dbType, b.dbType) && wildCompatible(a.licenseType, b.licenseType) && specificity(a, LIC_FIELDS) === specificity(b, LIC_FIELDS),
    (a, b) => add('licensePrices', `라이선스 가격 '${a.id}' 와 '${b.id}' 가 같은 구성 라벨, 가격 종류, vCPU 에 같은 구체성으로 적용되어 충돌합니다.`));
  pairwise(activeOf('nodeConfigRules'), (a, b) => NCR_FIELDS.every(f => wildCompatible(a[f], b[f])) && specificity(a, NCR_FIELDS) === specificity(b, NCR_FIELDS),
    (a, b) => add('nodeConfigRules', `노드 구성 라벨 규칙 '${a.id}' 와 '${b.id}' 가 같은 구체성으로 같은 조건에 적용되어 충돌합니다.`));

  (cfg.drRules || []).forEach(r => {
    if (Number(r.standbyMin) > Number(r.standbyMax)) add('drRules', `DR 규칙 '${r.id}' 의 Standby 최소가 최대보다 큽니다.`);
    if (Number(r.standbyDefault) < Number(r.standbyMin) || Number(r.standbyDefault) > Number(r.standbyMax)) add('drRules', `DR 규칙 '${r.id}' 의 Standby 기본값이 범위를 벗어납니다.`);
  });

function pairwise(list, test, onHit) { for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) if (test(list[i], list[j])) onHit(list[i], list[j]); }

function loadConfig() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);

      if (!errs.length) { pricingConfig = parsed; return { source: 'local' }; }
      console.warn('저장된 설정이 유효하지 않아 기본 설정을 사용합니다.', errs);
      return { source: 'default', warning: `저장된 설정에 오류가 있어 기본 설정을 사용합니다. (${errs[0]})` };
    }
  } catch (e) { console.warn('설정 불러오기 실패', e); }

  return { source: 'default' };
}
function saveConfig(touch = true) {
  if (touch) pricingConfig.meta.updatedAt = nowIso();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(pricingConfig)); } catch (e) { console.warn('설정 저장 실패', e); }
}
function loadInputs() {
  try { const raw = localStorage.getItem(INPUT_KEY); if (raw) { const p = JSON.parse(raw); if (p && p.volumes) inputs = Object.assign(deepClone(DEFAULT_INPUTS), p); } } catch (e) { /* 무시 */ }
}
function saveInputs() { try { localStorage.setItem(INPUT_KEY, JSON.stringify(inputs)); } catch (e) { /* 무시 */ } }
function exportConfigJson() { return JSON.stringify(pricingConfig, null, 2); }
function importConfigJson(text) {
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { return { ok: false, errors: [`JSON 구문 오류: ${e.message}`] }; }
  const errors = validateConfig(parsed);

}
function resetConfig() { pricingConfig = deepClone(DEFAULT_PRICING_CONFIG); saveConfig(true); }

/* ==========================================================================
 * 4. 규칙 조회
 * ========================================================================== */
function pricingDate() { return pricingConfig.meta.pricingDate || todayStr(); }
function getCsp(id) { return pricingConfig.csps.find(c => c.id === id && c.active !== false); }
function getDbType(id) { return pricingConfig.dbTypes.find(d => d.id === id); }
function getTopology(id) { return pricingConfig.topologies.find(t => t.id === id && t.active !== false); }
function getLicenseType(id) { return pricingConfig.licenseTypes.find(l => l.id === id && l.active !== false); }
function getInstance(id, csp) { return pricingConfig.instances.find(i => i.id === id && (!csp || i.csp === csp)); }
function effectiveInstances(csp) { return pricingConfig.instances.filter(i => i.csp === csp && isEffective(i, pricingDate())); }
function effectiveStorageTypes(csp) { return pricingConfig.storageTypes.filter(s => s.csp === csp && isEffective(s, pricingDate())); }

/* 와일드카드 규칙 중 가장 구체적인 항목 선택. 동률이면 conflict */

}
function findRedoRule(dbType) {

}
/* DB 유형별 허용 구성 방식. 비어 있으면 null (전체 허용) */
function dbAllowedTopologies(dbType) {

  const list = db ? splitList(db.allowedTopologies) : [];

}
/* CSP 별 허용 DB 유형. 비어 있으면 null (전체 허용) */
function cspAllowedDbTypes(cspId) {
  const c = pricingConfig.csps.find(x => x.id === cspId);
  const list = c ? splitList(c.allowedDbTypes) : [];
  return list.length ? list : null;
}
/* CSP 별 허용 라이선스 유형. 비어 있으면 null (전체 허용) */
function cspAllowedLicenseTypes(cspId) {

  const list = c ? splitList(c.allowedLicenseTypes) : [];
  return list.length ? list : null;
}
/* 구성 방식별 허용 스토리지 유형 코드. 비어 있으면 null (전체 허용) */
function topologyAllowedStorage(topoId) {

/* 노드 역할에 적용되는 구성 라벨 규칙 */
function findNodeConfig(inp, nodeRole) {
  return pickMostSpecific(pricingConfig.nodeConfigRules.filter(r => r.active !== false), ['dbType', 'topology', 'edition', 'nodeRole'], { dbType: inp.dbType, topology: inp.topology, edition: inp.edition, nodeRole });
}
/* 구성 라벨, 가격 종류, vCPU 에 맞는 라이선스 가격 */
function findLicensePrice(inp, kind, config, vcpu) {
  const cands = pricingConfig.licensePrices.filter(p => p.priceKind === kind && String(p.config).trim() === String(config).trim() && Number(p.vcpu) === Number(vcpu) && isEffective(p, pricingDate()));
  return pickMostSpecific(cands, ['dbType', 'licenseType'], { dbType: inp.dbType, licenseType: inp.licenseType });

/* 인스턴스가 현재 구성(기본 노드 라벨)에서 라이선스 가격을 갖는지 */
function instanceHasPrice(inst, inp) {
  const lt = getLicenseType(inp.licenseType); if (!lt) return true;
  const base = findNodeConfig(inp, 'base'); if (!base.item || base.conflict.length) return true;
  return splitList(lt.chargedPriceKinds).every(kind => { const r = findLicensePrice(inp, kind, base.item.config, inst.vcpu); return !!r.item; });
}
function volumeEnabled(volDef, dbType) {
  if (!volDef.dbFlag) return true;
  const db = getDbType(dbType);

}

/* 입력에 적용되는 제약 조건 도출 (화면 비활성화, 범위, 강제값) */

    if (clampNodes && inp.drEnabled) {

/* ==========================================================================
 * 5. 입력 검증
 * ========================================================================== */
function validateInputs(inp) {
  const errors = {}; const warns = {};
  const c = deriveConstraints(inp);
  if (!getCsp(inp.csp)) errors.csp = '활성화된 CSP 를 선택하세요.';
  if (!getDbType(inp.dbType)) errors.dbType = 'DB 유형을 선택하세요.';
  else {
    const allowedDb = cspAllowedDbTypes(inp.csp);
    if (allowedDb && !allowedDb.includes(inp.dbType)) errors.dbType = `${getCsp(inp.csp)?.name || inp.csp} 은 ${allowedDb.join(', ')} 만 지원합니다.`;
  }
  if (!getLicenseType(inp.licenseType)) errors.licenseType = '라이선스 유형을 선택하세요.';
  else {
    const allowedLt = cspAllowedLicenseTypes(inp.csp);
    if (allowedLt && !allowedLt.includes(inp.licenseType)) errors.licenseType = `${getCsp(inp.csp)?.name || inp.csp} 은 ${allowedLt.map(id => getLicenseType(id)?.name || id).join(', ')} 라이선스 유형만 지원합니다.`;
  }
  if (!c.topo) errors.topology = '구성 방식을 선택하세요.';
  else {
    const allowedTopos = dbAllowedTopologies(inp.dbType);
    if (allowedTopos && !allowedTopos.includes(inp.topology)) errors.topology = `${inp.dbType} 은 ${allowedTopos.join(', ')} 구성만 지원합니다.`;
    const allowed = splitList(c.topo.allowedEditions);
    if (!allowed.includes(inp.edition)) errors.edition = `${c.topo.name} 구성은 ${allowed.join(', ') || '(허용 에디션 없음)'} 에디션만 허용합니다.`;
    const n = toNum(inp.baseNodes);
    if (n === null || !Number.isInteger(n)) errors.baseNodes = '기본 노드 수를 정수로 입력하세요.';
    else if (n < c.topo.minBaseNodes || n > c.topo.maxBaseNodes) {
      errors.baseNodes = c.topo.minBaseNodes === c.topo.maxBaseNodes ? `${c.topo.name} 구성의 기본 노드 수는 ${c.topo.minBaseNodes} 이어야 합니다.` : `${c.topo.name} 구성의 기본 노드 수는 ${c.topo.minBaseNodes}~${c.topo.maxBaseNodes} 만 허용합니다.`;
    }
  }
  if (!pricingConfig.editions.some(e => e.id === inp.edition)) errors.edition = '에디션을 선택하세요.';
  const inst = getInstance(inp.instance, inp.csp);

  // DR
  if (c.dr.conflict.length) errors.drEnabled = `DR 규칙이 충돌합니다: ${c.dr.conflict.map(r => r.id).join(', ')}. 관리자 설정에서 정리하세요.`;
  else if (!c.dr.rule) errors.drEnabled = `${inp.dbType} ${inp.topology} 조합에 적용할 DR 규칙이 없습니다.`;
  else {
    const d = c.dr;
    if (!d.allowed && inp.drEnabled) errors.drEnabled = `${inp.dbType} ${inp.topology} 구성은 DR 을 지원하지 않습니다.`;
    if (d.required && !inp.drEnabled) errors.drEnabled = `${inp.dbType} ${inp.topology} 구성은 DR 사용이 필수입니다.`;
    if (inp.drEnabled) {

      if (ro === null || !Number.isInteger(ro)) errors.readOnlyNodes = 'Read Only 노드 수를 정수로 입력하세요.';

    if (!st) errors[`${vd.key}_type`] = `${getCsp(inp.csp)?.name || inp.csp} 에 등록된 스토리지 유형을 선택하세요.`;
    else {
      const allowedSt = topologyAllowedStorage(inp.topology);
      if (allowedSt && !allowedSt.includes(st.code)) errors[`${vd.key}_type`] = `${c.topo?.name || inp.topology} 구성은 ${allowedSt.join(', ')} 스토리지 유형만 사용할 수 있습니다.`;
    }
    const size = toNum(v.sizeGb);
    if (size === null || size <= 0) errors[`${vd.key}_sizeGb`] = '용량(GB)은 0 보다 큰 값을 입력하세요.';
    const iops = toNum(v.iops), mbps = toNum(v.mbps);
    if (iops === null || iops < 0) errors[`${vd.key}_iops`] = 'IOPS 는 0 이상이어야 합니다.';
    if (mbps === null || mbps < 0) errors[`${vd.key}_mbps`] = 'Mbps 는 0 이상이어야 합니다.';

        if (val === null) return null;

/* ==========================================================================
 * 6. 계산 로직
 * ========================================================================== */
function effectiveNodeCounts(inp) {
  const base = Math.max(0, toNum(inp.baseNodes) || 0);
  const standby = inp.drEnabled ? Math.max(0, toNum(inp.standbyNodes) || 0) : 0;
  const readOnly = inp.drEnabled ? Math.max(0, toNum(inp.readOnlyNodes) || 0) : 0;
  const total = base + standby + (pricingConfig.meta.includeReadOnlyInTotalNodes ? readOnly : 0);

/* Redo 용량 자동 산정. 결과 {gb, rule, steps, error} */
function computeRedoSize(inp) {

  if (found.conflict.length) return { error: `Redo 산정 규칙이 충돌합니다: ${found.conflict.map(r => r.id).join(', ')}` };
  const rule = found.item;
  if (!rule) return { error: `${inp.dbType} 에 적용할 Redo Log 용량 산정 규칙이 없습니다.` };
  const nodes = effectiveNodeCounts(inp);
  const topo = getTopology(inp.topology);
  const vars = {
    dataGb: toNum(inp.volumes.data.sizeGb) || 0, redoFileSizeMb: toNum(inp.redoFileSizeMb) || 0,
    baseNodes: nodes.base, standbyNodes: nodes.standby, readOnlyNodes: nodes.readOnly, totalNodes: nodes.total,
    topologyFactor: topo ? Number(topo.redoTopologyFactor) : 1, redoFileCount: Number(rule.redoFileCount), mirrorFactor: Number(rule.mirrorFactor), marginRatio: Number(rule.marginRatio)
  };
  try {
    const raw = evalFormula(rule.formula, vars);
    const withMin = Math.max(Number(rule.minGb) || 0, raw);
    const mult = Number(rule.multipleOf) || 0;
    const gb = mult > 0 ? Math.ceil(withMin / mult - 1e-9) * mult : withMin;
    return { gb, rule, vars, raw, withMin };
  } catch (e) { return { error: `Redo 산정 규칙 '${rule.id}' 오류: ${e.message}`, rule }; }
}

/* 누진 구간 계산. usage 를 [from,to) 구간에 차례로 배분. 월 단가 구간은 월 환산 시간으로 나눠 시간당 금액으로 환산 */
function calcTiered(tiers, usage, unitLabel, H) {
  const sorted = tiers.slice().sort((a, b) => Number(a.from) - Number(b.from));
  const steps = []; let costHour = 0; let covered = 0;
  for (const t of sorted) {
    const lo = Number(t.from), hi = isBlank(t.to) ? Infinity : Number(t.to);
    if (lo > covered + 1e-9) break; // 빈틈
    const upper = Math.min(usage, hi);
    const qty = Math.max(0, upper - Math.max(lo, covered));
    if (qty > 0) {
      const price = Number(t.pricePerUnit), hourly = t.unit === 'hour' ? qty * price : qty * price / H;
      steps.push({ tier: t, lo, hi, qty, price, unit: t.unit, hour: hourly }); costHour += hourly;
    }
    covered = Math.max(covered, upper);
    if (covered >= usage) break;
  }
  const uncovered = usage > covered + 1e-9 ? { from: covered, to: usage } : null;
  const text = steps.length ? steps.map(s => `${fmtNum(s.qty)} ${unitLabel} × ${s.price}${s.unit === 'hour' ? '/시간' : `/월 ÷ ${H}h`}`).join(' + ') : `0 ${unitLabel}`;
  return { steps, costHour, uncovered, text };
}

function calcVolume(vd, inp, nodes, H, errors) {
  const v = inp.volumes[vd.key];
  const cspName = getCsp(inp.csp)?.name || inp.csp;
  const st = effectiveStorageTypes(inp.csp).find(s => s.code === v.type);
  if (!st) { errors.push(`${vd.label}: ${cspName} 에 '${v.type || '(미선택)'}' 스토리지 유형 가격이 등록되어 있지 않습니다.`); return null; }
  const sizeGb = toNum(v.sizeGb) || 0, iops = toNum(v.iops) || 0, mbps = toNum(v.mbps) || 0;
  const gbHour = !isBlank(st.pricePerGbHour) ? Number(st.pricePerGbHour) : Number(st.pricePerGbMonth) / H;
  const gbCostHour = sizeGb * gbHour;
  const parts = [{ label: '용량', text: `${fmtNum(sizeGb)} GB × ${fmtNum(gbHour, 8)}/GB·시간${isBlank(st.pricePerGbHour) ? ` (${st.pricePerGbMonth}/GB·월 ÷ ${H}h)` : ''}`, hour: gbCostHour }];
  let ok = true;
  for (const [flag, key, usage, unit, label] of [['iopsBillable', 'iopsTiers', iops, 'IOPS', 'IOPS'], ['mbpsBillable', 'mbpsTiers', mbps, 'Mbps', '처리량']]) {
    if (st[flag] === false) { parts.push({ label, text: `${fmtNum(usage)} ${unit} (이 스토리지 유형은 ${unit} 별도 과금 없음)`, hour: 0 }); continue; }
    const tiers = pricingConfig[key].filter(t => t.csp === inp.csp && t.storageType === st.code && isEffective(t, pricingDate()));
    if (!tiers.length) { errors.push(`${vd.label}: ${cspName} / ${st.code} 의 ${unit} 구간 단가가 등록되어 있지 않습니다. (필요 사용량 ${fmtNum(usage)} ${unit})`); ok = false; continue; }
    const r = calcTiered(tiers, usage, unit, H);
    if (r.uncovered) { errors.push(`${vd.label}: ${cspName} / ${st.code} 의 ${unit} 구간이 ${fmtNum(r.uncovered.from)}~${fmtNum(r.uncovered.to)} ${unit} 범위를 포함하지 않습니다. 등록 구간: ${tiers.map(t => `${t.from}~${isBlank(t.to) ? '무제한' : t.to}`).join(', ')}`); ok = false; continue; }
    parts.push({ label, text: r.text, hour: r.costHour, steps: r.steps });
  }
  if (!ok) return null;
  const perSet = parts.reduce((s, p) => s + p.hour, 0);
  const sets = storageSets(inp, nodes);
  return {
    key: vd.key, label: vd.lineLabel,
    basis: `${cspName} ${st.code} ${fmtNum(sizeGb)} GB, ${fmtNum(iops)} IOPS, ${fmtNum(mbps)} Mbps × ${sets.count} 세트 (${sets.text})`,
    qty: `${fmtNum(sizeGb)} GB × ${sets.count} 세트`,
    unitPrice: `${st.pricePerGbMonth}/GB·월${st.iopsBillable !== false || st.mbpsBillable !== false ? ' + 구간 단가' : ''}`,
    formula: `(${parts.map(p => `${p.label}: ${p.text}`).join(' + ')}) × ${sets.count} 세트`,
    parts, rawHourly: perSet * sets.count,
    notes: [st.memo].filter(Boolean)
  };
}

/* 스토리지 세트 수: 기본 노드는 구성 방식의 스토리지 모드(노드당 또는 클러스터당 1세트), DR Standby 는 노드당 1세트 */
function storageSets(inp, nodes) {
  const topo = getTopology(inp.topology);
  const cluster = topo && topo.storageMode === 'cluster';
  const baseSets = cluster ? (nodes.base > 0 ? 1 : 0) : nodes.base;
  const extraRo = pricingConfig.meta.includeReadOnlyInTotalNodes ? nodes.readOnly : 0;
  const count = baseSets + nodes.standby + extraRo;
  const parts = [cluster ? `${topo.name} 클러스터 공유 ${baseSets}` : `기본 노드 ${baseSets}`];
  if (nodes.standby) parts.push(`Standby 노드 ${nodes.standby}`);
  if (extraRo) parts.push(`Read Only 추가 ${extraRo}`);
  return { count, baseSets, cluster, text: parts.join(' + ') };
}

function calculate(inp) {
  const cfg = pricingConfig, meta = cfg.meta, H = Number(meta.hoursPerMonth) || 730, date = pricingDate();
  const errors = [], warnings = [], lines = [], rules = [];
  const validation = validateInputs(inp);
  const inputErrs = Object.values(validation.errors);
  const nodes = effectiveNodeCounts(inp);
  const cspName = getCsp(inp.csp)?.name || inp.csp;
  const topo = validation.constraints.topo, lt = getLicenseType(inp.licenseType), db = getDbType(inp.dbType);

  rules.push({ title: '총 노드 수', formula: `${nodes.base} (기본) + ${nodes.standby} (Standby)${meta.includeReadOnlyInTotalNodes ? ` + ${nodes.readOnly} (Read Only)` : ''} = ${nodes.total}`, note: meta.includeReadOnlyInTotalNodes ? 'Read Only 노드를 Standby 외 추가 노드로 계산 (기본 설정)' : `Read Only 노드 ${nodes.readOnly} 개는 Standby 노드 ${nodes.standby} 개 중 읽기 전용으로 개방하는 노드이므로 별도로 더하지 않습니다.` });
  if (topo) rules.push({ title: `구성 방식 규칙 (${topo.id})`, note: `기본 노드 ${topo.minBaseNodes}~${topo.maxBaseNodes}, 허용 에디션 ${topo.allowedEditions}, Redo 구성 계수 ${topo.redoTopologyFactor}, 기본 노드 스토리지 ${topo.storageMode === 'cluster' ? '클러스터당 1세트(공유)' : '노드당 1세트'}` });
  { const s = storageSets(inp, nodes); rules.push({ title: '스토리지 세트 수', formula: `${s.text} = ${s.count} 세트`, note: '데이터, Redo Log, Archive Log 볼륨은 세트 수만큼 곱합니다. 루트 볼륨은 총 노드 수 기준입니다.' }); }
  if (db) rules.push({ title: `DB 유형 규칙 (${db.id})`, note: `허용 구성 방식: ${dbAllowedTopologies(db.id)?.join(', ') || '전체'}. Redo 볼륨 ${db.usesRedoVolume === false ? '미사용' : '사용'}, Archive 볼륨 ${db.usesArchiveVolume === false ? '미사용' : '사용'}` });
  rules.push({ title: `CSP 규칙 (${cspName})`, note: `제공 DB 유형: ${cspAllowedDbTypes(inp.csp)?.join(', ') || '전체'}. 허용 라이선스 유형: ${(cspAllowedLicenseTypes(inp.csp) || []).map(id => getLicenseType(id)?.name || id).join(', ') || '전체'}` });
  if (validation.constraints.dr.rule) { const r = validation.constraints.dr.rule; rules.push({ title: `DR 규칙 (${r.id})`, note: `DR ${r.drAllowed === false ? '불허' : (r.drRequired ? '필수' : '선택')}, Standby ${r.standbyMin}~${r.standbyMax}, Read Only 최대 ${r.readOnlyMax}${r.readOnlyLimitedByStandby !== false ? ' 및 Standby 이하' : ''}${r.memo ? '. ' + r.memo : ''}` }); }

  // 인스턴스
  const inst = getInstance(inp.instance, inp.csp);
  if (inst && isEffective(inst, date)) {
    const p = Number(inst.pricePerHour);
    lines.push({ key: 'instance', label: '인스턴스', basis: `${cspName} ${inst.name} (${inst.vcpu} vCPU, ${inst.memoryGb} GB)`, qty: `${nodes.total} 노드`, unitPrice: `${p}/노드·시간`, formula: `${p} × ${nodes.total} 노드`, rawHourly: p * nodes.total, notes: [inst.memo].filter(Boolean) });
  } else if (!validation.errors.instance) errors.push('인스턴스 가격을 찾을 수 없습니다.');

  // 루트 볼륨
  const roots = cfg.rootVolumeRules.filter(r => r.csp === inp.csp && isEffective(r, date));
  if (!roots.length) errors.push(`루트 볼륨: ${cspName} 의 루트 볼륨 단가가 등록되어 있지 않습니다.`);
  else if (roots.length > 1) errors.push(`루트 볼륨: ${cspName} 에 기준일에 유효한 루트 볼륨 규칙이 ${roots.length}개(${roots.map(r => r.id).join(', ')}) 있어 어느 것을 적용할지 정할 수 없습니다.`);
  else {
    const r = roots[0], size = Number(r.sizeGbPerNode), pm = Number(r.pricePerGbMonth);
    lines.push({ key: 'root', label: '루트 볼륨', basis: `노드당 ${size} GB × ${nodes.total} 노드`, qty: `${size * nodes.total} GB`, unitPrice: `${pm}/GB·월`, formula: `${size} GB × ${nodes.total} 노드 × ${pm} ÷ ${H}h`, rawHourly: size * nodes.total * pm / H, notes: [r.memo].filter(Boolean) });
  }

  // 데이터, Redo, Archive 볼륨
  for (const vd of VOLUME_DEFS) {
    if (!volumeEnabled(vd, inp.dbType)) {
      lines.push({ key: vd.key, label: vd.lineLabel, excluded: true, basis: db?.notice || `${inp.dbType} 은 ${vd.label} 을 사용하지 않습니다.`, qty: '제외', unitPrice: '', formula: '비용 계산 제외', rawHourly: 0, notes: [] });
      continue;
    }
    const line = calcVolume(vd, inp, nodes, H, errors);
    if (line) {
      if (vd.key === 'redo' && inp.volumes.redo.auto) { const rs = computeRedoSize(inp); if (rs.rule && !rs.error) rules.push({ title: `Redo Log 용량 자동 산정 (${rs.rule.id})`, formula: `${rs.rule.formula}\n= ${fmtNum(rs.raw, 2)} GB → 최소 ${rs.rule.minGb} GB 보장 → ${rs.rule.multipleOf} GB 배수 올림 → ${fmtNum(rs.gb)} GB`, note: `변수: ${Object.entries(rs.vars).map(([k, v]) => `${k}=${v}`).join(', ')}` }); }
      lines.push(line);
    }
  }

  // 라이선스 및 미터링
  if (lt && inst) {
    const kinds = splitList(lt.chargedPriceKinds);
    rules.push({ title: `라이선스 유형 규칙 (${lt.id})`, note: `${lt.description || ''} 부과 항목: ${kinds.map(k => cfg.priceKinds.find(p => p.id === k)?.name || k).join(', ') || '(없음)'}` });
    const notCharged = cfg.priceKinds.filter(k => !kinds.includes(k.id));
    // 노드 역할별 구성 라벨 결정 (Read Only 는 Standby 안에 포함)
    const roCount = Math.min(nodes.readOnly, nodes.standby);
    const roleGroups = [
      { role: 'base', label: '기본 노드', count: nodes.base },
      { role: 'standby', label: '복구용 Standby', count: nodes.standby - roCount },
      { role: 'readonly', label: 'Read Only Standby', count: roCount }
    ].filter(g => g.count > 0);
    const labelNotes = [];
    for (const g of roleGroups) {
      const found = findNodeConfig(inp, g.role);
      if (found.conflict.length) { errors.push(`노드 구성 라벨: ${g.label} 에 규칙 ${found.conflict.map(r => r.id).join(', ')} 이 같은 구체성으로 겹쳐 라벨을 정할 수 없습니다.`); continue; }
      if (!found.item) { errors.push(`노드 구성 라벨: ${inp.dbType} / ${inp.topology} / ${inp.edition} / ${g.label} 에 적용할 구성 라벨 규칙이 없습니다.`); continue; }
      g.config = String(found.item.config).trim(); g.ruleId = found.item.id;
      labelNotes.push(`${g.label} ${g.count}개 → ${g.config} (규칙 ${g.ruleId})`);
    }
    if (labelNotes.length) rules.push({ title: '노드별 라이선스 구성 라벨', note: labelNotes.join(' / ') });
    const byConfig = {};
    for (const g of roleGroups) { if (!g.config) continue; const e = byConfig[g.config] = byConfig[g.config] || { count: 0, roles: [] }; e.count += g.count; e.roles.push(`${g.label} ${g.count}`); }
    for (const kind of kinds) {
      const kindName = cfg.priceKinds.find(p => p.id === kind)?.name || kind;
      for (const [config, grp] of Object.entries(byConfig)) {
        const picked = findLicensePrice(inp, kind, config, inst.vcpu);
        if (picked.conflict.length) { errors.push(`${kindName}: ${inp.dbType} / ${config} / ${inst.vcpu} vCPU 에 같은 구체성의 가격 항목 ${picked.conflict.map(c => c.id).join(', ')} 이 겹쳐 적용할 가격을 정할 수 없습니다.`); continue; }
        if (!picked.item) { errors.push(`${kindName}: ${inp.dbType} / ${lt.name} / ${config} / ${inst.vcpu} vCPU 조건에 등록된 가격이 없습니다. 가격표에 '-' 로 표시된 조합이거나 미등록 상태입니다. 다른 인스턴스(vCPU)를 선택하거나 관리자 설정에서 가격을 등록하세요.`); continue; }
        const p = picked.item, price = Number(p.price);
        let qty, qtyText, formula;
        if (p.unit === 'vcpu-hour') { qty = inst.vcpu * grp.count; qtyText = `${inst.vcpu} vCPU × ${grp.count} 노드 = ${qty} vCPU`; formula = `${price} × ${inst.vcpu} vCPU × ${grp.count} 노드`; }
        else if (p.unit === 'node-hour') { qty = grp.count; qtyText = `${grp.count} 노드`; formula = `${price} × ${grp.count} 노드`; }
        else { qty = 1; qtyText = '1 (고정)'; formula = `${price} (시간당 고정)`; }
        const unitLabel = LICENSE_UNITS.find(u => u.value === p.unit)?.label || p.unit;
        lines.push({ key: 'lic-' + kind, label: `${kindName} (${config})`, basis: `${inp.dbType} / ${lt.name} / ${config} / ${inst.vcpu} vCPU → 가격 항목 '${p.id}'. 적용 노드: ${grp.roles.join(', ')}`, qty: qtyText, unitPrice: `${price}/${unitLabel}`, formula, rawHourly: price * qty, notes: [p.memo].filter(Boolean) });
      }
    }
    for (const k of notCharged) lines.push({ key: 'lic-' + k.id, label: k.name, excluded: true, basis: `${lt.name} 규칙에 따라 부과하지 않음`, qty: '제외', unitPrice: '', formula: '비용 계산 제외', rawHourly: 0, notes: [] });
  }

  // 반올림과 합계. 표시되는 세부 금액의 합이 최종 금액이 되도록 각 항목을 먼저 반올림
  for (const l of lines) { l.hourly = roundTo(l.rawHourly, meta.hourlyDecimals, meta.roundingMode); l.monthly = roundTo(l.rawHourly * H, meta.monthlyDecimals, meta.roundingMode); }
  const totalHourly = roundTo(lines.reduce((s, l) => s + l.hourly, 0), meta.hourlyDecimals, meta.roundingMode);
  const totalMonthly = roundTo(lines.reduce((s, l) => s + l.monthly, 0), meta.monthlyDecimals, meta.roundingMode);
  rules.push({ title: '반올림과 월 환산', note: `시간당 금액은 소수 ${meta.hourlyDecimals}자리, 월 금액은 소수 ${meta.monthlyDecimals}자리로 ${roundingLabel(meta.roundingMode)}. 월 금액 = 항목별 시간당 원가 × ${H}시간. 합계는 표시된 항목 금액의 합입니다.` });

  const ok = inputErrs.length === 0 && errors.length === 0;
  return { ok, inputErrors: inputErrs, priceErrors: errors, warnings: Object.values(validation.warns), lines, rules, totalHourly, totalMonthly, nodes, H, validation };
}

  sel.innerHTML = options.map(o => `<option value="${esc(o.value)}"${o.disabled ? ' disabled' : ''}>${esc(o.label)}</option>`).join('');
  if (options.some(o => o.value === current)) sel.value = current;

}
function setHint(fieldKey, msg, level) {
  const wrap = $(`[data-field="${fieldKey}"]`);

  hint.className = 'hint' + (level ? ' ' + level : '');

}

function renderSeg(id, options, current) {
  const el = $('#' + id);
  el.innerHTML = options.map(o => `<button type="button" data-seg="${esc(id)}" data-value="${esc(o.value)}" class="${o.value === current ? 'on' : ''}" ${o.disabled ? 'disabled' : ''} title="${esc(o.title || '')}">${esc(o.label)}${o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ''}</button>`).join('');
}
/* 스테퍼 입력의 값, 범위, 활성 상태를 한 번에 반영 */
function setStepper(id, value, min, max, disabled) {
  const el = $('#' + id);
  el.value = value; el.min = min; el.max = max; el.disabled = disabled;
  const v = toNum(value);
  $$(`[data-stepper="${id}"]`).forEach(b => { const step = Number(b.dataset.step); b.disabled = disabled || v === null || (step < 0 && v <= min) || (step > 0 && v >= max); });
}
/* 인스턴스 선택기 (검색, 시리즈 필터, 목록) */
let instFilter = { q: '', family: '*' };
let instLastScrolled = null;
function instFamilyOf(i) {
  if (i.family) return i.family;
  const m = String(i.name).match(/^Standard_([A-Za-z]+?)\d/);
  if (m) return m[1];
  return String(i.name).includes('.') ? i.name.split('.')[0] : i.name;
}
function renderInstancePicker(list, inp) {
  const fams = [...new Set(list.map(instFamilyOf))].sort();
  if (instFilter.family !== '*' && !fams.includes(instFilter.family)) instFilter.family = '*';
  renderSeg('instFamily', [{ value: '*', label: '전체' }, ...fams.map(f => ({ value: f, label: f }))], instFilter.family);
  const search = $('#instSearch'); if (search.value !== instFilter.q) search.value = instFilter.q;
  const q = instFilter.q.trim().toLowerCase();
  const rows = list.filter(i => (instFilter.family === '*' || instFamilyOf(i) === instFilter.family) && (!q || i.name.toLowerCase().includes(q) || String(i.vcpu) === q.replace(/\s*vcpu$/, '')))
    .sort((a, b) => a.vcpu - b.vcpu || a.pricePerHour - b.pricePerHour || a.name.localeCompare(b.name));
  const sym = pricingConfig.meta.currencySymbol;
  const hiddenCount = rows.filter(i => !instanceHasPrice(i, inp)).length;
  const shown = rows.filter(i => instanceHasPrice(i, inp));
  $('#instList').innerHTML = `<div class="instrow head"><span>인스턴스명</span><span class="num">vCPU</span><span class="num">메모리</span><span class="num">노드당 시간</span></div>` +
    (shown.length ? shown.map(i => `<button type="button" class="instrow ${i.id === inp.instance ? 'on' : ''}" data-inst="${esc(i.id)}" role="option" aria-selected="${i.id === inp.instance}"><span class="name">${esc(i.name)}<span class="mut">${esc(instFamilyOf(i))}</span></span><span class="num">${i.vcpu}</span><span class="num">${fmtNum(i.memoryGb)} GB</span><span class="num">${sym}${i.pricePerHour}</span></button>`).join('')
      : `<div class="empty">${list.length ? '조건에 맞는 인스턴스가 없습니다. 검색어나 시리즈 필터, 구성을 확인하세요.' : '이 CSP 에 등록된 활성 인스턴스가 없습니다. 관리자 설정에서 등록하세요.'}</div>`);
  const on = $('#instList .instrow.on');
  if (on && instLastScrolled !== inp.instance) { $('#instList').scrollTop = Math.max(0, on.offsetTop - 80); instLastScrolled = inp.instance; }
  setHint('instance', list.length ? `현재 구성에서 선택 가능한 인스턴스 ${shown.length}개 표시.${hiddenCount ? ` 라이선스 가격이 없는 ${hiddenCount}개(${[...new Set(rows.filter(i => !instanceHasPrice(i, inp)).map(i => i.vcpu))].sort((a, b) => a - b).join(', ')} vCPU)는 목록에서 제외했습니다.` : ''}` : '');
}
function rangeText(min, max, unit) {
  if (isBlank(min) && isBlank(max)) return '입력 범위 제한 없음';
  return `입력 범위 ${isBlank(min) ? '0' : fmtNum(min)}~${isBlank(max) ? '제한 없음' : fmtNum(max)} ${unit}`;
}
function markPresets(id, value) { $$(`[data-preset="${id}"]`).forEach(b => b.classList.toggle('on', toNum(b.dataset.value) === toNum(value))); }
function renderNodeViz(inp, nodes) {
  const boxes = [];
  for (let i = 0; i < Math.min(nodes.base, 12); i++) boxes.push(`<div class="node active">Active<small>${esc(inp.topology)} ${i + 1}</small></div>`);
  const roCount = Math.min(nodes.readOnly, nodes.standby);
  for (let i = 0; i < Math.min(nodes.standby, 12); i++) {
    const isRo = i >= nodes.standby - roCount;
    boxes.push(`<div class="node standby ${isRo ? 'ro' : ''}">Standby<small>${isRo ? 'Read Only 개방' : 'DR 대기'}</small></div>`);
  }
  const extra = pricingConfig.meta.includeReadOnlyInTotalNodes ? ` + Read Only ${nodes.readOnly}` : '';
  $('#nodeViz').innerHTML = boxes.join('') + `<span class="sum">총 ${nodes.total} 노드 (기본 ${nodes.base} + Standby ${nodes.standby}${extra})</span>`;
}

function renderForm() {
  const inp = inputs;
  const cspOpts = pricingConfig.csps.filter(c => c.active !== false).map(c => ({ value: c.id, label: c.name }));
  if (!cspOpts.some(o => o.value === inp.csp) && cspOpts.length) inp.csp = cspOpts[0].value;
  renderSeg('csp', cspOpts, inp.csp);
  const allowedDb = cspAllowedDbTypes(inp.csp);
  const dbOpts = pricingConfig.dbTypes.map(d => { const off = allowedDb && !allowedDb.includes(d.id); return { value: d.id, label: d.name, disabled: off, title: off ? `${getCsp(inp.csp)?.name || inp.csp} 에서는 제공하지 않습니다.` : '' }; });

  const allowedLt = cspAllowedLicenseTypes(inp.csp);
  const ltOpts = pricingConfig.licenseTypes.filter(l => l.active !== false).map(l => { const off = allowedLt && !allowedLt.includes(l.id); return { value: l.id, label: l.name, disabled: off, title: off ? `${getCsp(inp.csp)?.name || inp.csp} 에서는 선택할 수 없습니다.` : (l.description || '') }; });
  if (!ltOpts.some(o => o.value === inp.licenseType) && ltOpts.length) inp.licenseType = (ltOpts.find(o => !o.disabled) || ltOpts[0]).value;
  renderSeg('licenseType', ltOpts, inp.licenseType);
  const allowedTopos = dbAllowedTopologies(inp.dbType);
  const topoOpts = pricingConfig.topologies.filter(t => t.active !== false).map(t => {
    const off = allowedTopos && !allowedTopos.includes(t.id);
    return { value: t.id, label: t.name, sub: t.minBaseNodes === t.maxBaseNodes ? `노드 ${t.minBaseNodes}` : `노드 ${t.minBaseNodes}~${t.maxBaseNodes}`, disabled: off, title: off ? `${inp.dbType} 은 ${t.name} 구성을 지원하지 않습니다.` : (t.description || '') };
  });
  if (!topoOpts.some(o => o.value === inp.topology) && topoOpts.length) inp.topology = (topoOpts.find(o => !o.disabled) || topoOpts[0]).value;
  renderSeg('topology', topoOpts, inp.topology);
  const c = deriveConstraints(inp);
  const topo = c.topo;
  const allowedEds = topo ? splitList(topo.allowedEditions) : null;
  const edOpts = pricingConfig.editions.map(e => { const off = allowedEds && !allowedEds.includes(e.id); return { value: e.id, label: e.name, disabled: off, title: off ? `${topo.name} 구성은 ${allowedEds.join(', ')} 에디션만 허용합니다.` : '' }; });
  if (!edOpts.some(o => o.value === inp.edition) && edOpts.length) inp.edition = edOpts[0].value;
  renderSeg('edition', edOpts, inp.edition);

  const instAll = effectiveInstances(inp.csp);
  const selectable = instAll.filter(i => instanceHasPrice(i, inp));
  if (!selectable.some(i => i.id === inp.instance)) inp.instance = selectable[0]?.id || instAll[0]?.id || '';
  renderInstancePicker(instAll, inp);
  const inst = getInstance(inp.instance, inp.csp);
  $('#instInfo').innerHTML = inst ? `<span>선택: <b>${esc(inst.name)}</b></span><span>vCPU ${inst.vcpu}</span><span>메모리 ${fmtNum(inst.memoryGb)} GB</span><span>노드당 ${pricingConfig.meta.currencySymbol}${inst.pricePerHour}/시간</span>${inst.memo ? `<span>${esc(inst.memo)}</span>` : ''}` : '';
  $('#redoFileSizeMb').value = inp.redoFileSizeMb;

  if (topo) { setStepper('baseNodes', inp.baseNodes, topo.minBaseNodes, topo.maxBaseNodes, false); setHint('baseNodes', topo.minBaseNodes === topo.maxBaseNodes ? `${topo.name} 구성은 ${topo.minBaseNodes} 노드 고정` : `허용 범위 ${topo.minBaseNodes}~${topo.maxBaseNodes}`); }
  else setStepper('baseNodes', inp.baseNodes, 1, 99, false);
  if (topo) setHint('edition', `허용 에디션: ${(allowedEds || []).join(', ')}`);
  setHint('topology', (allowedTopos ? `${inp.dbType} 허용 구성: ${allowedTopos.join(', ')}. ` : '') + (topo?.description || ''));
  setHint('licenseType', (allowedLt ? `${getCsp(inp.csp)?.name || inp.csp} 허용: ${allowedLt.map(id => getLicenseType(id)?.name || id).join(', ')}. ` : '') + (getLicenseType(inp.licenseType)?.description || ''));

  // DR 제약
  const d = c.dr;
  const drOpts = [{ value: 'no', label: '미사용' }, { value: 'yes', label: '사용', sub: 'Standby 노드 추가' }];
  if (d.rule) {
    if (!d.allowed) { drOpts[1].disabled = true; drOpts[1].title = 'DR 미지원 구성'; setHint('drEnabled', `${inp.dbType} ${inp.topology} 구성은 DR 을 지원하지 않습니다.`, 'info'); }
    else if (d.required) { drOpts[0].disabled = true; drOpts[0].title = 'DR 필수 구성'; setHint('drEnabled', `${inp.dbType} ${inp.topology} 구성은 DR 사용이 필수입니다.`, 'info'); }
    else setHint('drEnabled', '');
    if (!inp.drEnabled) { setStepper('standbyNodes', inp.standbyNodes, 0, 0, true); setStepper('readOnlyNodes', inp.readOnlyNodes, 0, 0, true); setHint('standbyNodes', 'DR 미사용'); setHint('readOnlyNodes', 'DR 미사용'); }
    else {
      const roMax = Math.min(d.readOnlyMax, d.roByStandby ? (toNum(inp.standbyNodes) ?? 0) : Infinity);
      setStepper('standbyNodes', inp.standbyNodes, d.standbyMin, d.standbyMax, d.standbyMin === d.standbyMax);
      setStepper('readOnlyNodes', inp.readOnlyNodes, 0, roMax, false);
      setHint('standbyNodes', d.standbyMin === d.standbyMax ? `규칙에 따라 ${d.standbyMin} 고정` : `허용 범위 ${d.standbyMin}~${d.standbyMax}`);
      setHint('readOnlyNodes', `Standby ${toNum(inp.standbyNodes) ?? 0} 개 중 읽기 전용으로 개방할 노드 수 (최대 ${roMax})`);
    }
    $('#drRuleHint').textContent = `적용 DR 규칙: ${d.rule.id}${d.rule.memo ? '. ' + d.rule.memo : ''}`;
  } else { renderSeg('drEnabled', drOpts, inp.drEnabled ? 'yes' : 'no'); setStepper('standbyNodes', inp.standbyNodes, 0, 99, !inp.drEnabled); setStepper('readOnlyNodes', inp.readOnlyNodes, 0, 99, !inp.drEnabled); $('#drRuleHint').textContent = ''; }
  renderSeg('drEnabled', drOpts, inp.drEnabled ? 'yes' : 'no');
  renderNodeViz(inp, effectiveNodeCounts(inp));

  // 볼륨
  const allowedSt = topologyAllowedStorage(inp.topology);
  const stAll = effectiveStorageTypes(inp.csp);
  const stOpts = stAll.map(s => { const off = allowedSt && !allowedSt.includes(s.code); return { value: s.code, label: s.code, sub: `${s.name}, ${pricingConfig.meta.currencySymbol}${s.pricePerGbMonth}/GB 월`, disabled: off, title: off ? `${getTopology(inp.topology)?.name || inp.topology} 구성에서는 사용할 수 없습니다.` : '' }; });
  const redoSize = computeRedoSize(inp);
  const hiddenVolumes = [];
  for (const vd of VOLUME_DEFS) {
    const v = inp.volumes[vd.key];
    const enabled = volumeEnabled(vd, inp.dbType);
    const block = $(`#vol-${vd.key}`);
    block.hidden = !enabled;
    if (!enabled) hiddenVolumes.push(vd.label);
    $(`#volTag-${vd.key}`).hidden = true;
    $(`#volBanner-${vd.key}`).hidden = true;
    if (!stOpts.some(o => o.value === v.type) && stOpts.length) v.type = (stOpts.find(o => !o.disabled) || stOpts[0]).value;
    renderSeg(`${vd.key}_type`, stOpts.length ? stOpts.map(o => ({ ...o, disabled: o.disabled || !enabled })) : [{ value: '', label: '등록된 스토리지 유형 없음', disabled: true }], v.type);
    const st = stAll.find(s => s.code === v.type);
    setHint(`${vd.key}_type`, st && enabled ? `${st.name}${st.memo ? '. ' + st.memo : ''}` : '');
    const range = { sizeGb: st ? [st.minGb, st.maxGb] : [1, null], iops: st ? [st.minIops, st.maxIops] : [0, null], mbps: st ? [st.minMbps, st.maxMbps] : [0, null] };
    const sizeRange = st ? rangeText(st.minGb, st.maxGb, 'GB') : '';
    for (const prop of ['sizeGb', 'iops', 'mbps']) { const el = $(`#${vd.key}_${prop}`); el.min = isBlank(range[prop][0]) ? 0 : range[prop][0]; if (isBlank(range[prop][1])) el.removeAttribute('max'); else el.max = range[prop][1]; }
    if (!vd.supportsAuto) setHint(`${vd.key}_sizeGb`, enabled ? sizeRange : '');
    $(`#${vd.key}_sizeGb`).value = v.sizeGb; $(`#${vd.key}_iops`).value = v.iops; $(`#${vd.key}_mbps`).value = v.mbps;

    if (vd.supportsAuto) {
      v.auto = true;
      const sizeEl = $(`#${vd.key}_sizeGb`);
      sizeEl.readOnly = true;
      if (enabled) {
        if (redoSize && !redoSize.error) { v.sizeGb = redoSize.gb; sizeEl.value = redoSize.gb; setHint(`${vd.key}_sizeGb`, `Redo Log File Size ${fmtNum(inp.redoFileSizeMb)} MB 기준 자동 산정: ${fmtNum(redoSize.gb)} GB (규칙 ${redoSize.rule.id}, 최소 ${redoSize.rule.minGb} GB)`, 'info'); }
        else setHint(`${vd.key}_sizeGb`, redoSize?.error || '자동 산정 불가', 'error');
      } else setHint(`${vd.key}_sizeGb`, '');

      setHint(`${vd.key}_mbps`, `${st.mbpsBillable === false ? '처리량 별도 과금 없음' : 'Mbps 구간 단가 누진 적용'}. ${rangeText(st.minMbps, st.maxMbps, 'Mbps')}`);
    } else { setHint(`${vd.key}_iops`, ''); setHint(`${vd.key}_mbps`, ''); }
  }

  if (hiddenVolumes.length) vn.textContent = `${hiddenVolumes.join(', ')} 제외: ` + (getDbType(inp.dbType)?.notice || `${inp.dbType} 은 이 볼륨을 구성하지 않으므로 표시하지 않으며 비용 계산에서 제외됩니다.`);
  const redoOn = volumeEnabled(VOLUME_DEFS[1], inp.dbType);
